<!DOCTYPE html>
<html lang="ko">
<head>
<meta data-sim charset="utf-8">
<meta data-sim name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아이폰 시뮬레이터</title>
<meta data-sim name="description" content="iOS 스타일 휴대폰 UI 시뮬레이터 & 에디터 — 소설·연성용">
<link data-sim rel="preconnect" href="https://fonts.googleapis.com"><link data-sim rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
<style data-sim>
/* 레이아웃: 어두운 작업대 위 기기 한 대 + 오른쪽 에디터 패널 (단일 다크 테마) */
:root{
  --page:#0e0f12; --pn-bg:#16171b; --pn-card:#202228; --pn-fg:#ececf1; --pn-mute:#9a9ca8; --pn-line:#2d2f37;
  --accent:#f2b366; --accent-ink:#20150a; --edit:#7d7aff;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --def-wall:radial-gradient(120% 70% at 20% 10%,#ffcf8b 0%,rgba(255,207,139,0) 55%),radial-gradient(90% 60% at 90% 30%,#ff7aa2 0%,rgba(255,122,162,0) 60%),radial-gradient(120% 80% at 50% 100%,#3b2c85 0%,rgba(59,44,133,0) 70%),linear-gradient(170deg,#5b6ee1,#2b2a6e 60%,#14123a);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);background-image:radial-gradient(60% 50% at 40% 45%,#1d2027 0%,rgba(14,15,18,0) 70%);color:var(--pn-fg);font-family:var(--f);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
#page{display:flex;height:100%;width:100%}
#stageWrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
#stage{position:relative;flex-shrink:0}
#scaler{position:absolute;left:0;top:0;width:446px;height:902px;transform-origin:0 0}

/* ---------- 기기 프레임 ---------- */
.device{--ti1:#cfcac2;--ti2:#8f8a82;--ti3:#6c6862;position:absolute;left:12px;top:11px;width:421px;height:880px;border-radius:68px;padding:4px;
  background:linear-gradient(135deg,var(--ti1) 0%,var(--ti2) 22%,var(--ti1) 48%,var(--ti3) 75%,var(--ti2) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),inset 0 0 2px 2px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.55),0 40px 80px -20px rgba(0,0,0,.75),0 18px 30px -10px rgba(0,0,0,.5)}
.device[data-color=black]{--ti1:#5a5a5e;--ti2:#2d2d30;--ti3:#1c1c1e}
.device[data-color=white]{--ti1:#f2f1ee;--ti2:#cfcdc8;--ti3:#a9a7a2}
.device[data-color=desert]{--ti1:#e4cfb4;--ti2:#b49a7d;--ti3:#8c7660}
.device[data-color=blue]{--ti1:#6e7d97;--ti2:#3d4860;--ti3:#283146}
.bezel{width:100%;height:100%;border-radius:64px;background:#050505;padding:10px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08)}
.hw{position:absolute;width:5px;border-radius:2px;background:linear-gradient(90deg,var(--ti3),var(--ti1) 60%,var(--ti2));cursor:pointer;z-index:-1}
.hw:hover{filter:brightness(1.15)}
.hw-action{left:-4px;top:150px;height:32px}.hw-volu{left:-4px;top:212px;height:62px}.hw-vold{left:-4px;top:288px;height:62px}
.hw-power{right:-4px;top:248px;height:100px}.hw-cam{right:-3px;top:520px;height:52px;width:4px;cursor:default}
.screen{position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;background:#000;isolation:isolate;
  font-family:var(--f);color:#000;font-size:15px;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;letter-spacing:-.01em}
.screen input,.screen textarea{user-select:text;-webkit-user-select:text}
:where(.screen) button{background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;cursor:pointer;letter-spacing:inherit}
.screen img{display:block}
.screen p{margin:0}
.screen h1,.screen h2{margin:0}
.ic{display:block;flex-shrink:0}
.glare{position:absolute;inset:0;border-radius:55px;pointer-events:none;z-index:99;background:linear-gradient(120deg,rgba(255,255,255,.05),rgba(255,255,255,0) 28%)}

/* ---------- 상태바 ---------- */
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:80;display:flex;justify-content:space-between;align-items:center;pointer-events:none;transition:color .25s}
.sb-light{color:#fff}.sb-dark{color:#000}
.sb-l,.sb-r{width:136px;display:flex;align-items:center;justify-content:center;gap:5px;padding-top:2px}
.sb-l{padding-left:6px}.sb-r{padding-right:4px;gap:6px}
.sb-l,.sb-r{transition:padding .45s cubic-bezier(.3,1.3,.45,1),opacity .25s}
.sb-wide .sb-l{justify-content:flex-start;padding-left:30px}.sb-wide .sb-r{justify-content:flex-end;padding-right:26px}
.sb-hid .sb-l,.sb-hid .sb-r{opacity:0}
.sb-time{font-size:17px;font-weight:600;letter-spacing:-.2px;pointer-events:auto;font-variant-numeric:tabular-nums}
.sb-carrier{font-size:15px;font-weight:600}
.sb-net{font-size:14px;font-weight:600}
.sb-focus{color:#7d7aff}
.sig{display:inline-flex;align-items:flex-end;gap:1.6px;height:11px}
.sig i{width:3px;background:currentColor;border-radius:1px}
.sb-wifi svg{display:block}
.bat{display:inline-flex;align-items:center;gap:1px;position:relative}
.bat-body{position:relative;width:25px;height:12.5px;border-radius:4px;border:1px solid;border-color:color-mix(in srgb,currentColor 40%,transparent);padding:1px;overflow:hidden}
.bat-fill{display:block;height:100%;border-radius:2.5px}
.bat.pct .bat-body{width:27px;height:13px;border:0;padding:0;background:color-mix(in srgb,currentColor 38%,transparent);border-radius:4px}
.bat.pct .bat-fill{border-radius:0}
.bat-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:-.4px}
.sb-light .bat-num{color:#000}.sb-dark .bat-num{color:#fff}
.bat-cap{width:2px;height:4.5px;border-radius:0 1px 1px 0;background:currentColor;opacity:.45}
.bat-bolt{position:absolute;right:-12px;top:0;color:currentColor}
.bat.chg{margin-right:10px}

/* ---------- 다이나믹 아일랜드 ---------- */
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:20px;z-index:90;color:#fff;
  display:flex;align-items:center;overflow:hidden;cursor:pointer;
  transition:width .55s cubic-bezier(.3,1.35,.45,1),height .55s cubic-bezier(.3,1.35,.45,1),border-radius .5s,top .4s;box-shadow:0 0 0 .5px rgba(255,255,255,.04)}
.island.mode-music,.island.mode-timer{width:230px}
.island.mode-notify,.island.mode-call{width:371px;height:78px;border-radius:40px;top:9px}
.island.mode-big{width:371px;height:188px;border-radius:48px;top:9px}
.di-art{width:24px;height:24px;border-radius:7px;margin-left:8px;object-fit:cover;animation:diIn .35s .1s both}
.di-fill{flex:1}
.di-tic{color:#ff9f0a;margin-left:12px;animation:diIn .35s .1s both}
.di-tt{color:#ff9f0a;font-size:15px;font-weight:600;margin-right:15px;font-variant-numeric:tabular-nums;animation:diIn .35s .1s both}
.wave{display:flex;align-items:center;gap:2px;height:16px;margin-right:13px;animation:diIn .35s .1s both}
.wave i{width:3px;height:4px;border-radius:2px;background:#ff6f91}
.wave.on i{animation:wv .8s ease-in-out infinite alternate}
.wave.on i:nth-child(2n){animation-duration:.62s}.wave.on i:nth-child(3n){animation-duration:1.05s}
@keyframes wv{0%{height:3px}100%{height:16px}}
@keyframes diIn{from{opacity:0;transform:scale(.6)}}
.di-n,.di-call{display:flex;align-items:center;gap:11px;padding:0 18px 0 16px;width:100%;animation:diIn .35s .14s both}
.di-av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0}
.di-nt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.di-nt b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.di-nt span{font-size:14px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.di-call .di-nt span{font-size:12px}
.di-dec,.di-acc{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.screen .di-dec{background:#ff3b30}.screen .di-acc{background:#34c759}
.di-dec svg{transform:rotate(135deg)}
.di-big{width:100%;padding:20px 24px 12px;animation:diIn .35s .16s both}
.di-bt{display:flex;align-items:center;gap:12px}
.di-bt img{width:50px;height:50px;border-radius:11px;object-fit:cover}
.di-btt{flex:1;min-width:0;display:flex;flex-direction:column}
.di-btt b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.di-btt span{font-size:14px;opacity:.6}
.di-prog{display:flex;align-items:center;gap:8px;font-size:11px;opacity:.75;margin-top:14px;font-variant-numeric:tabular-nums}
.di-bar{flex:1;height:5px;background:rgba(255,255,255,.22);border-radius:3px;overflow:hidden}
.di-bar i{display:block;height:100%;background:#fff}
.di-ctl{display:flex;justify-content:space-around;align-items:center;margin-top:8px}

/* ---------- 홈바 & 볼륨 HUD ---------- */
.homebar{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:200px;height:30px;z-index:85;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;cursor:pointer;touch-action:none}
.homebar i{width:139px;height:5px;border-radius:3px;background:currentColor;transition:transform .2s}
.homebar:hover i{transform:scaleX(1.06)}
.hb-light{color:rgba(255,255,255,.92)}.hb-dark{color:#111}.hb-hide{display:none}
#volHud{position:absolute;left:10px;top:180px;width:38px;height:150px;border-radius:19px;background:rgba(40,40,40,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:96;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;opacity:0;transform:translateX(-20px);transition:.25s;pointer-events:none}
#volHud.on{opacity:1;transform:none}
#volHud i{flex:1;width:8px;border-radius:4px;background:rgba(255,255,255,.25);display:flex;align-items:flex-end;overflow:hidden}
#volHud b{display:block;width:100%;background:#fff;border-radius:4px}

/* ---------- 잠금화면 ---------- */
.lock{position:absolute;inset:0;z-index:60;color:#fff;overflow:hidden}
.lock.unlocking{animation:unlockUp .33s cubic-bezier(.5,0,.8,.4) forwards}
.lock.locking{animation:lockIn .35s ease-out}
.lock.wake .lk-main{animation:wake .7s ease-out}
@keyframes unlockUp{to{transform:translateY(-100%);opacity:.4}}
@keyframes lockIn{from{filter:brightness(0)}}
@keyframes wake{from{filter:brightness(.25)}}
.lk-wall,.hm-wall{position:absolute;inset:0;background-color:#1c1c2a;background-size:cover;background-position:center}
.lk-wall.def,.hm-wall.def,.s-wp.def{background:var(--def-wall)}
.lk-main{position:absolute;inset:0;display:flex;flex-direction:column;transition:filter .3s,transform .3s}
.lk-main.blur{filter:blur(16px) brightness(.62);transform:scale(1.05)}
.lk-head{padding-top:56px;text-align:center;text-shadow:0 1px 10px rgba(0,0,0,.12);cursor:default}
.lk-padlock{display:flex;justify-content:center;opacity:.95}
.lk-date{font-size:20px;font-weight:600;margin-top:8px}
.lk-time{font-size:100px;font-weight:700;letter-spacing:-3px;line-height:.95;font-variant-numeric:tabular-nums;font-family:"SF Pro Rounded","SF Pro Display",var(--f)}
.lk-wg{display:flex;justify-content:center;gap:10px;margin-top:12px;font-size:14px}
.lk-w1,.lk-w2{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.lk-w1 span{font-weight:600}.lk-w1 small,.lk-w2 small{opacity:.8}
.lk-w2 b{font-weight:600;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-list{flex:1;min-height:0;overflow-y:auto;padding:14px 10px 6px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 22px);mask-image:linear-gradient(transparent,#000 22px)}
.lk-list::-webkit-scrollbar{display:none}
.lk-list>:first-child{margin-top:auto}
.lk-nc{font-size:15px;font-weight:600;padding:0 8px 2px;text-shadow:0 1px 6px rgba(0,0,0,.2)}
.glass-l{background:rgba(246,246,246,.66);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8)}
.glass-d{background:rgba(30,30,30,.32);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);color:#fff}
.lk-card{display:flex;gap:11px;padding:12px 14px;border-radius:22px;color:#000;align-items:flex-start;cursor:pointer;flex-shrink:0;transition:transform .15s}
.lk-card:active{transform:scale(.98)}
.lk-card.pop{animation:cardPop .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardPop{from{opacity:0;transform:translateY(-30px) scale(.9)}}
.lkc-ic{position:relative;flex-shrink:0}
.lkc-av{width:38px;height:38px;border-radius:50%;object-fit:cover}
.lkc-mini{position:absolute;right:-4px;bottom:-4px}
.lkc-b{flex:1;min-width:0}
.lkc-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lkc-h b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lkc-h span{font-size:13px;color:rgba(0,0,0,.48);flex-shrink:0}
.lkc-sub{font-size:13px;font-weight:600;color:rgba(0,0,0,.6)}
.lkc-t{font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.lkc-more{font-size:13px;color:rgba(0,0,0,.45);margin-top:3px}
.lk-moreall{flex-shrink:0;margin:0 auto;padding:6px 14px;border-radius:14px;font-size:13px;color:#000!important}
.lk-media{border-radius:24px;padding:14px 16px;flex-shrink:0}
.lkm-top{display:flex;align-items:center;gap:12px}
.lkm-top img{width:46px;height:46px;border-radius:9px;object-fit:cover}
.lkm-top div{flex:1;min-width:0;display:flex;flex-direction:column}
.lkm-top b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lkm-top span{font-size:14px;opacity:.65}
.lkm-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:14px 0 8px;overflow:hidden}
.lkm-bar i{display:block;height:100%;background:#fff}
.lkm-ctl{display:flex;justify-content:space-around;align-items:center}
.lk-bottom{display:flex;justify-content:space-between;align-items:center;padding:8px 46px 42px;flex-shrink:0}
.lk-qb{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.screen .lk-qb.on{background:#fff;color:#000}
.lk-hint{font-size:13px;font-weight:500;opacity:.85;cursor:pointer;padding:10px;animation:hint 2.6s ease-in-out infinite}
@keyframes hint{0%,100%{transform:none;opacity:.6}50%{transform:translateY(-4px);opacity:1}}
.pin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:118px;animation:fadeIn .25s}
.pin-t{font-size:20px;font-weight:500}
.pin-dots{display:flex;gap:24px;margin:20px 0 54px}
.pin-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;transition:background .1s}
.pin-dots i.on{background:#fff}
.pin-dots.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,80px);gap:16px 26px}
.screen .pin-k{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.17);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:background .12s}
.screen .pin-k:active{background:rgba(255,255,255,.55)}
.pin-k b{font-size:36px;font-weight:400;line-height:1}
.pin-k small{font-size:10px;letter-spacing:2px;font-weight:700;margin-top:1px}
.pin-f{position:absolute;bottom:52px;left:52px;right:52px;display:flex;justify-content:space-between;font-size:17px}
.pin-hint{position:absolute;bottom:100px;font-size:12px;opacity:.6}
@keyframes fadeIn{from{opacity:0}}

/* ---------- 홈화면 ---------- */
.home{position:absolute;inset:0;z-index:5;transition:transform .45s cubic-bezier(.2,.9,.3,1),filter .4s}
.home.zoomin{animation:homeIn .45s cubic-bezier(.2,.9,.3,1)}
@keyframes homeIn{from{transform:scale(1.12);filter:blur(4px)}}
.hm-grid{position:absolute;top:64px;left:20px;right:20px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:82px;row-gap:16px}
.hm-app{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:opacity .15s,transform .15s}
.hm-app.pressed{opacity:.55;transform:scale(.94)}
.hm-ic{position:relative}
.hm-lb{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap;letter-spacing:-.2px}
.badge{position:absolute;top:-6px;right:-8px;min-width:23px;height:23px;border-radius:12px;background:#ff3b30;color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0 6px;font-style:normal;z-index:2;font-variant-numeric:tabular-nums}
.badge.sm{top:-5px;right:-11px;min-width:18px;height:18px;font-size:11.5px;padding:0 5px}
.badge.red{background:#d93025}
.aicon{border-radius:23%;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.14);position:relative;flex-shrink:0}
.aicon img{width:100%;height:100%;object-fit:cover}
.ai-cal{display:flex;flex-direction:column;align-items:center;line-height:1;width:100%;height:100%;justify-content:center;gap:1px}
.ai-cal span{color:#ff3b30;font-weight:600}
.ai-cal b{font-weight:300;color:#000;letter-spacing:-1px}
.ai-petals{position:relative}
.ai-petals i{position:absolute;left:50%;top:0;width:36%;height:50%;margin-left:-18%;border-radius:50% 50% 42% 42%;transform-origin:50% 100%;opacity:.8;mix-blend-mode:multiply}
.wg{border-radius:22px;padding:14px 15px;color:#000;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;overflow:hidden;transition:transform .15s}
.wg:active{transform:scale(.97)}
.wg-cal{grid-column:span 4;grid-row:span 2;display:flex;gap:14px}
.cw-l{flex:1;min-width:0;display:flex;flex-direction:column}
.cw-dow{color:#ff3b30;font-size:12px;font-weight:700}
.cw-day{font-size:38px;font-weight:300;line-height:1;margin-top:2px}
.cw-evs{margin-top:auto;display:flex;flex-direction:column;gap:5px}
.cw-ev{border-left:3px solid var(--c);padding-left:7px;line-height:1.25}
.cw-ev b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-ev span{display:block;font-size:11px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-none{font-size:12px;color:#8e8e93}
.cw-r{width:154px;flex-shrink:0}
.cw-mon{color:#ff3b30;font-size:11.5px;font-weight:700;padding-left:3px}
.cw-grid{display:grid;grid-template-columns:repeat(7,1fr);font-size:9.5px;text-align:center;row-gap:2px;margin-top:4px;font-variant-numeric:tabular-nums}
.cw-grid i{font-style:normal;height:17px;line-height:17px;position:relative;font-weight:500}
.cw-grid i.cw-h{color:#8e8e93;font-weight:700;font-size:9px}
.cw-grid i.sun{color:#ff3b30}
.cw-grid i.ev::after{content:"";position:absolute;bottom:0;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#8e8e93}
.cw-grid i.td{background:#ff3b30;color:#fff;border-radius:50%;font-weight:700;width:17px;margin:0 auto}
.cw-grid i.td::after{background:#fff}
.wg-wx{grid-column:span 2;grid-row:span 2;margin-right:9px;background:linear-gradient(180deg,#2f75d6,#69a8ee);color:#fff;display:flex;flex-direction:column}
.ww-city{font-size:15px;font-weight:600;display:flex;align-items:center;gap:3px}

/* ---------- 앱 레이어 ---------- */

@keyframes appOpen{from{transform:scale(.14);opacity:.15;border-radius:90px}}
@keyframes appClose{to{transform:scale(.14);opacity:0;border-radius:90px}}
#appView{position:absolute;inset:0}
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.anim-push{animation:push .34s cubic-bezier(.2,.9,.3,1)}
.anim-pop{animation:popv .3s cubic-bezier(.2,.9,.3,1)}
@keyframes push{from{transform:translateX(38%);opacity:.3}}
@keyframes popv{from{transform:translateX(-22%);opacity:.5}}
.safe-top{padding-top:54px!important}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar,.screen ::-webkit-scrollbar{display:none;width:0;height:0}

.sp{flex:1}

.pressed{background-color:rgba(0,0,0,.05)!important}

/* ---------- 폰 내부 시트 ---------- */
#sheetHost{position:absolute;inset:0;z-index:70;pointer-events:none}
#sheetHost.on{pointer-events:auto}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.28);opacity:0;transition:opacity .25s}
#sheetHost.on .sh-bg{opacity:1}
.sh-bg.dim{background:rgba(0,0,0,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:14px 14px 0 0;padding-bottom:30px;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1);max-height:90%;display:flex;flex-direction:column}
#sheetHost.on .sheet{transform:none}
#sheetHost.off .sheet{transform:translateY(100%)}
#sheetHost.off .sh-bg{opacity:0}
.sh-grab{width:36px;height:5px;border-radius:3px;background:#c7c7cc;margin:7px auto 5px;flex-shrink:0}
.sheet-tall{height:76%}
.sheet-tall>:not(.sh-grab){flex:1;min-height:0}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 10px;font-size:17px}
.sh-h button{color:#0a84ff;font-weight:600}
.sh-scroll{overflow-y:auto;background:#f2f2f7;padding-top:14px}
.sheet-as{background:transparent;padding:0 8px 34px}
.sheet-as .sh-grab{display:none}
.as{background:rgba(250,250,250,.93);border-radius:14px;overflow:hidden;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.as-t{font-size:13px;color:#8e8e93;text-align:center;padding:13px}
.screen .as-b{display:block;width:100%;height:57px;font-size:19px;color:#0a84ff;border-top:.5px solid rgba(0,0,0,.14)}
.as>.as-b:first-child{border-top:0}
.screen .as-b.danger{color:#ff3b30}
.screen .as-cancel{display:block;width:100%;height:57px;margin-top:8px;background:#fff;border-radius:14px;font-size:19px;font-weight:600;color:#0a84ff}
.alert{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:270px;background:rgba(242,242,242,.96);backdrop-filter:blur(20px);border-radius:14px;text-align:center;overflow:hidden;animation:alertIn .25s cubic-bezier(.2,1.3,.4,1)}
@keyframes alertIn{from{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
.alert>b{display:block;padding:19px 16px 2px;font-size:17px}
.alert p{font-size:13px;padding:3px 16px 0;line-height:1.35}
.al-bs{display:flex;border-top:.5px solid rgba(0,0,0,.2);margin-top:18px}
.screen .al-bs button{flex:1;height:44px;font-size:17px;color:#0a84ff}
.al-bs button+button{border-left:.5px solid rgba(0,0,0,.2)}
.screen .al-bs button.danger{color:#ff3b30}
.al-bs button.bold{font-weight:600}
.sheet-side{left:0;right:auto;top:0;bottom:0;width:300px;border-radius:0 18px 18px 0;transform:translateX(-100%)!important;padding-top:60px;max-height:none}
#sheetHost.on .sheet-side{transform:none!important}
.sheet-side .sh-grab{display:none}

/* ---------- 통화 / 알람 오버레이 ---------- */
#overlay{position:absolute;inset:0;z-index:75;pointer-events:none}
#overlay.ov-call,#overlay.ov-alarm{pointer-events:auto}

/* ---------- YouTube 플레이어 상자 ---------- */

.ig-body{flex:1;min-height:0;overflow-y:auto}
.ig-stories{display:flex;gap:12px;overflow-x:auto;padding:6px 12px 10px;border-bottom:.5px solid #dbdbdb}
.ig-st{display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;flex-shrink:0;position:relative;cursor:pointer}
.ig-st small{font-size:11.5px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig-ring{border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(from 200deg,#ffc36b,#ff7a3d,#f0306f,#b93ad6,#ffc36b);flex-shrink:0}
.ig-ring img{border-radius:50%;object-fit:cover;border:3px solid #fff;box-sizing:border-box}
.ig-ring.sm img{border-width:2px}
.ig-ring.seen{background:#dbdbdb}
.ig-ring.none{background:transparent}
.ig-ring.add{background:#efefef;color:#000}
.ig-st-plus{position:absolute;right:3px;top:50px;width:22px;height:22px;border-radius:50%;background:#0095f6;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.ig-post{padding-bottom:4px}
.ig-ph{display:flex;align-items:center;gap:9px;padding:8px 10px}
.ig-pn{flex:1;line-height:1.2;cursor:pointer;min-width:0}
.ig-pn b{display:block;font-size:13.5px;font-weight:600}
.ig-pn span{font-size:11.5px}
.ig-pimg{position:relative;aspect-ratio:1;background:#eee;overflow:hidden}
.ig-pimg img,.ig-pimg video{width:100%;height:100%;object-fit:cover;display:block}
.ig-bigheart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;opacity:0;pointer-events:none;filter:drop-shadow(0 4px 14px rgba(0,0,0,.3))}
.ig-bigheart.pop{animation:heartPop .9s ease}
@keyframes heartPop{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(.95)}45%,80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.ig-acts{display:flex;gap:15px;padding:9px 12px 5px;align-items:center}
.ig-acts .liked,.ig-rside .liked,.igs-reply .liked{color:#ff3040}
.ig-likes{font-weight:600;font-size:13.5px;padding:0 13px}
.ig-cap{font-size:13.5px;padding:3px 13px;line-height:1.38;user-select:text}
.ig-cap b{font-weight:600}
.ig-cmore{color:#737373;font-size:13.5px;padding:3px 13px;cursor:pointer}
.ig-ago{color:#737373;font-size:11px;padding:3px 13px 14px}
.ig-end{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 30px 40px;text-align:center;color:#737373;font-size:13px}
.ig-end b{color:#000;font-size:16px}
.ig-end .ic{color:#c13584;border:2px solid currentColor;border-radius:50%;padding:6px;width:46px;height:46px}
.ig-tabs{display:flex;justify-content:space-around;align-items:center;padding:10px 0 30px;border-top:.5px solid #dbdbdb;background:#fff;flex-shrink:0}
.ig-tab{position:relative;color:#000}
.ig-tav{width:27px;height:27px;border-radius:50%;object-fit:cover}
.ig-tab.on .ig-tav{outline:2px solid #000;outline-offset:1px}
.ig-dot{position:absolute;top:-6px;right:-9px;background:#ff3040;color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;border:1.5px solid #fff}
.ig-cs{display:flex;flex-direction:column}
.ig-cs-t{text-align:center;font-weight:600;padding:4px 0 11px;border-bottom:.5px solid #dbdbdb}
.ig-cs-l{flex:1;min-height:0;overflow-y:auto;padding:8px 14px}
.ig-c{display:flex;gap:11px;padding:8px 0;align-items:flex-start}
.ig-c img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.ig-c>div{flex:1;font-size:13.5px;line-height:1.35}
.ig-c b{font-weight:600}
.ig-c small{color:#737373;font-size:12px}
.ig-c p{margin:2px 0}
.ig-c-r{display:block;margin-top:2px}
.ig-c-h{color:#999;display:flex;flex-direction:column;align-items:center;font-size:11px}
.ig-cs-e{text-align:center;color:#000;font-size:20px;font-weight:700;padding:50px 0}
.ig-cs-e small{font-size:13px;color:#737373;font-weight:400}
.ig-cs-in{display:flex;gap:10px;align-items:center;padding:8px 12px 2px;border-top:.5px solid #dbdbdb}
.ig-cs-in img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.ig-cs-in input,.ig-sin input,.ig-dbar input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:15px;color:#000}
.ig-cs-in input{border:1px solid #dbdbdb;border-radius:22px;padding:9px 14px}
.ig-cs-in button{color:#0095f6}
.ig-reels{background:#000;color:#fff}
.ig-rh{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:6px;padding:0 16px 8px;font-size:21px;font-weight:700;pointer-events:none}
.ig-rh button{pointer-events:auto}
.ig-rl{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory}
.ig-reel{height:100%;scroll-snap-align:start;position:relative;overflow:hidden}
.ig-reel>img,.ig-reel>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ig-rgrad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 20%,transparent 60%,rgba(0,0,0,.55))}
.ig-rside{position:absolute;right:10px;bottom:22px;display:flex;flex-direction:column;gap:18px;align-items:center}
.ig-rside button{display:flex;flex-direction:column;align-items:center;gap:3px}
.ig-rside small{font-size:12px;font-weight:600}
.ig-raudio{width:28px;height:28px;border-radius:7px;border:2px solid #fff;object-fit:cover}
.ig-rinfo{position:absolute;left:14px;right:70px;bottom:20px;font-size:13.5px}
.ig-ru{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ig-ru img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.ig-follow{border:1px solid rgba(255,255,255,.65);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600}
.ig-raud{font-size:12.5px;display:flex;align-items:center;gap:5px;margin-top:8px;opacity:.95}
.ig-reels .ig-tabs{background:#000;border-color:#222}
.ig-reels .ig-tab{color:#fff}
.ig-dmh b{font-size:22px;font-weight:700;display:flex;align-items:center;gap:4px}
.ig-search{margin:4px 14px 10px;background:#efefef;border-radius:11px;height:37px;display:flex;align-items:center;gap:7px;padding:0 11px;color:#8e8e8e}
.ig-dmt{display:flex;justify-content:space-between;padding:6px 16px 8px;font-size:16px}
.ig-dmt b{font-weight:700}.ig-dmt span{color:#737373;font-size:14px}
.ig-dmr{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer;color:#a8a8a8}
.ig-dmr>img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.ig-dmi{flex:1;min-width:0}
.ig-dmi b{display:block;font-size:14.5px;font-weight:400;color:#000}
.ig-dmi span{display:block;font-size:13.5px;color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig-dmr.un b,.ig-dmr.un span{font-weight:600;color:#000}
.ig-un{width:9px;height:9px;border-radius:50%;background:#0095f6;flex-shrink:0}
.ig-rmh{display:flex;align-items:center;gap:10px;padding:0 12px 8px;border-bottom:.5px solid #dbdbdb;flex-shrink:0}
.ig-rmh>img{width:32px;height:32px;border-radius:50%;object-fit:cover;cursor:pointer}
.ig-rmn{flex:1;line-height:1.15;min-width:0}
.ig-rmn b{display:block;font-size:15px}
.ig-rmn span{font-size:12px;color:#737373}
.ig-msgs{flex:1;min-height:0;overflow-y:auto;padding:10px 12px}
.ig-mtop{display:flex;flex-direction:column;align-items:center;gap:2px;padding:20px 0 26px;font-size:13px;color:#737373}
.ig-mtop img{width:90px;height:90px;border-radius:50%;object-fit:cover;margin-bottom:8px}
.ig-mtop b{font-size:19px;color:#000}
.ig-mtop button{margin-top:10px;background:#efefef;border-radius:8px;padding:6px 12px;font-weight:600;color:#000;font-size:13.5px}
.ig-ts{text-align:center;font-size:11.5px;color:#8e8e8e;margin:14px 0 8px}
.ig-m{display:flex;align-items:flex-end;gap:7px;margin-top:2px}
.ig-m.me{justify-content:flex-end}
.ig-m>img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.ig-msp{width:26px;flex-shrink:0}
.ig-mb{max-width:72%;padding:9px 14px;border-radius:21px;font-size:14.5px;line-height:1.36;background:#efefef;word-break:break-word;user-select:text}
.ig-m.me .ig-mb{background:linear-gradient(160deg,#4f7cff,#6d5bf5);color:#fff}
.ig-mb.imgb{padding:0;background:none!important}
.ig-mb.imgb img{width:200px;border-radius:18px}
.ig-seen{text-align:right;font-size:11.5px;color:#8e8e8e;padding:3px 4px}
.ig-din{padding:6px 10px 28px;flex-shrink:0}
.ig-dbar{display:flex;align-items:center;gap:8px;border-radius:24px;background:#efefef;padding:5px 6px}
.ig-dcam{width:34px;height:34px;border-radius:50%;background:#4f7cff;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ig-dsend{color:#4f7cff;font-weight:600;font-size:15px;padding-right:8px}
.ig-sh{padding:0 12px 8px;flex-shrink:0}
.ig-sin{display:flex;gap:7px;align-items:center;background:#efefef;border-radius:11px;padding:0 11px;height:38px;color:#8e8e8e}
.ig-rec-h{display:flex;justify-content:space-between;padding:8px 16px}
.ig-rec-h span{color:#0095f6;cursor:pointer}
.ig-rec{display:flex;align-items:center;gap:12px;padding:7px 16px}
.ig-rec>img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.ig-rec-ic{width:44px;height:44px;border-radius:50%;border:1px solid #dbdbdb;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ig-rec>div{flex:1;min-width:0;line-height:1.25}
.ig-rec b{display:block;font-size:14px;font-weight:600}
.ig-rec span{font-size:13px;color:#737373}
.ig-rec>button{color:#737373}
.ig-explore{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:10px;grid-auto-rows:130px;grid-auto-flow:dense}
.ig-explore>div{position:relative;background:#eee;overflow:hidden;cursor:pointer}
.ig-explore>div.tall{grid-row:span 2}
.ig-explore img,.ig-explore video{width:100%;height:100%;object-fit:cover}
.ig-explore span{position:absolute;top:6px;right:6px;color:#fff}
.ig-prh b{font-size:20px;font-weight:700;display:flex;align-items:center;gap:4px}
.ig-pr{padding:6px 16px}
.ig-prt{display:flex;align-items:center;gap:20px}
.ig-cnt{flex:1;display:flex;justify-content:space-around;text-align:center}
.ig-cnt b{display:block;font-size:17px;font-weight:600}
.ig-cnt span{font-size:13px}
.ig-prn{margin-top:10px;font-size:14px;line-height:1.38}
.ig-prn b{font-weight:600}
.ig-prn a{color:#00376b}
.ig-prb{display:flex;gap:6px;margin-top:12px}
.ig-prb button{flex:1;height:33px;background:#efefef;border-radius:9px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.ig-prb button.blue{background:#0095f6;color:#fff}
.ig-prb button.sq{flex:0 0 34px}
.ig-hls{display:flex;gap:16px;overflow-x:auto;padding:14px 16px 10px}
.ig-hls>div{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;cursor:pointer}
.ig-hls span{width:66px;height:66px;border-radius:50%;border:1px solid #dbdbdb;padding:3px;display:flex;align-items:center;justify-content:center}
.ig-hls span img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.ig-hls small{font-size:12px}
.ig-ptabs{display:flex;border-top:.5px solid #dbdbdb}
.ig-ptabs span{flex:1;display:flex;justify-content:center;padding:10px;color:#999}
.ig-ptabs span.on{color:#000;border-bottom:1.5px solid #000}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ig-grid>div{aspect-ratio:3/4;background:#eee;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#aaa}
.ig-grid img,.ig-grid video{width:100%;height:100%;object-fit:cover}
.ig-noposts{text-align:center;color:#737373;padding:40px 0}
.ig-sec{font-weight:700;font-size:16px;padding:10px 16px}
.ig-act{display:flex;align-items:center;gap:12px;padding:8px 16px}
.ig-act.un{background:#f2f8ff}
.ig-act .av{width:44px;height:44px;border-radius:50%;object-fit:cover}
.ig-act p{flex:1;font-size:14px;line-height:1.35}
.ig-act small{color:#737373}
.ig-act .th{width:44px;height:44px;object-fit:cover}
.ig-fb{background:#0095f6!important;color:#fff;padding:6px 12px!important;border-radius:8px;font-weight:600;font-size:13px}
.ig-story{background:#000;color:#fff}
.igs-media{position:absolute;inset:48px 0 84px;border-radius:12px;overflow:hidden}
.igs-media img,.igs-media video{width:100%;height:100%;object-fit:cover}
.igs-top{position:absolute;top:0;left:0;right:0;padding:0 10px;z-index:2}
.igs-bars{display:flex;gap:3px;margin-top:2px}
.igs-bars i{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.igs-bars b{display:block;height:100%;width:0;background:#fff}
.igs-bars b.done{width:100%}
.igs-bars b.run{animation:storyRun 5s linear forwards}
@keyframes storyRun{to{width:100%}}
.igs-u{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.igs-u img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.igs-u span{opacity:.75}
.igs-nav{position:absolute;inset:120px 0 100px;display:flex;z-index:1}
.igs-nav span{flex:1;cursor:pointer}
.igs-reply{position:absolute;left:0;right:0;bottom:28px;display:flex;gap:14px;align-items:center;padding:0 14px;z-index:2}
.igs-reply input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:22px;height:44px;padding:0 16px;font:inherit;font-size:15px;outline:none}
.igs-reply input::placeholder{color:rgba(255,255,255,.85)}

/* =================== 전화 =================== */
.ph-list{background:#fff}
.ph-rc{display:flex;align-items:center;gap:4px;padding:0 10px 0 4px;min-height:60px;border-bottom:.5px solid rgba(60,60,67,.2);background:#fff;cursor:pointer}
.ph-dirw{width:20px;color:#8e8e93;display:flex;justify-content:center}
.ph-ri{flex:1;min-width:0;line-height:1.25}
.ph-ri b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-ri b.miss{color:#ff3b30}
.ph-ri span{font-size:14px;color:#8e8e93;display:flex;align-items:center;gap:4px}
.ph-new{width:7px;height:7px;border-radius:50%;background:#ff3b30;display:inline-block}
.ph-rt{font-size:15px;color:#8e8e93;white-space:nowrap}
.ph-info{color:#0a84ff;padding:4px 2px 4px 8px}
.ph-rc.fav{padding-left:16px;gap:12px}
.ph-fav{width:42px;height:42px;border-radius:50%;object-fit:cover}
.ph-kp{flex:1;display:flex;flex-direction:column;align-items:center;background:#fff}
.ph-num{font-size:36px;height:50px;margin-top:64px;letter-spacing:1px;font-variant-numeric:tabular-nums;max-width:90%;overflow:hidden;white-space:nowrap}
.ph-add{height:24px;color:#0a84ff;font-size:16px;cursor:pointer}
.ph-keys{display:grid;grid-template-columns:repeat(3,80px);gap:15px 26px;margin-top:22px;align-items:center;justify-items:center}
.ph-key{width:80px;height:80px;border-radius:50%;background:#e5e5ea;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .1s}
.ph-key:active{background:#b9b9be}
.ph-key b{font-size:35px;font-weight:400;line-height:1}
.ph-key small{font-size:10px;font-weight:700;letter-spacing:2px}
.ph-key.call{background:#34c759;color:#fff}
.ph-key.call:active{background:#2a9e47}
.ph-del{color:#8e8e93;width:80px;display:flex;align-items:center;justify-content:center}
.ph-ch{font-size:13px;font-weight:600;color:#8e8e93;padding:4px 16px;background:#f7f7f7}
.ph-ct{padding:11px 16px;font-size:17px;border-bottom:.5px solid #e5e5ea;background:#fff;cursor:pointer}
.ph-me{display:flex;gap:13px;align-items:center;padding:10px 16px 12px;background:#fff;border-bottom:.5px solid #e5e5ea;cursor:pointer}
.ph-me img{width:58px;height:58px;border-radius:50%;object-fit:cover}
.ph-me b{display:block;font-size:20px;font-weight:600}
.ph-me span{font-size:13px;color:#8e8e93}
.ph-cdh{text-align:center;padding:4px 0 16px;display:flex;flex-direction:column;align-items:center}
.ph-cdh img{width:112px;height:112px;border-radius:50%;object-fit:cover}
.ph-cdh h2{font-size:28px;font-weight:500;margin-top:10px}
.ph-qa{display:flex;gap:8px;padding:0 16px 20px}
.ph-qa button{flex:1;background:#fff;border-radius:11px;padding:9px 0 7px;color:#0a84ff;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}
.ph-cd .cell a{color:#0a84ff;font-size:17px;cursor:pointer}
.ph-ch2{font-size:14px;color:#333}

/* =================== 인터넷 =================== */
.sf{background:#f2f2f7}
.sf-start{padding-bottom:150px}
.sf-h{font-size:22px;font-weight:700;padding:16px 20px 10px;display:flex;justify-content:space-between;align-items:center}
.sf-h button{color:#0a84ff}
.sf-favs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 0;padding:0 10px}
.sf-fav{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.sf-fav span{width:62px;height:62px;border-radius:15px;color:#fff;font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center}
.sf-fav small{font-size:11.5px;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-card{background:#fff;margin:0 16px;border-radius:12px;overflow:hidden}
.sf-row{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:15px;border-bottom:.5px solid #e5e5ea;cursor:pointer;color:#8e8e93}
.sf-row>span{flex:1;color:#000;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-row:last-child{border-bottom:0}
.sf-row.dim{cursor:default}
.sf-row.hist div{flex:1;min-width:0;color:#000}
.sf-row.hist b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-row.hist small{font-size:12px;color:#8e8e93}
.sf-row>span.sf-hic{flex:0 0 32px}
.sf-hic{width:32px;height:32px;border-radius:8px;background:#e5e5ea;color:#636366;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sf-priv{margin:18px 16px;background:#fff;border-radius:12px;padding:14px;font-size:13px;color:#3c3c43;line-height:1.4}
.sf-priv b{display:block;font-size:15px;margin-bottom:3px;color:#000}
.sf-bot{position:absolute;left:0;right:0;bottom:0;padding:8px 12px 28px;border-top:.5px solid rgba(0,0,0,.1);z-index:5}
.sf-addr{display:flex;align-items:center;gap:8px;background:#fff;border-radius:13px;height:46px;padding:0 12px;box-shadow:0 1px 8px rgba(0,0,0,.12);font-size:16px;cursor:text}
.sf-addr>span{flex:1;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;color:#000;white-space:nowrap;overflow:hidden}
.sf-addr.edit input{flex:1;min-width:0;border:0;outline:none;font:inherit;font-size:16px;background:none;color:#000}
.sf-addr.edit button,.sf-addr button{color:#0a84ff}
.sf-tools{display:flex;justify-content:space-between;padding:12px 14px 0;color:#0a84ff}
.sf-tools .dim{color:#c7c7cc}
.sf-page{padding-bottom:150px;background:#fff}
.sf-art img{width:100%;height:220px;object-fit:cover}
.sf-art h1{font-size:24px;padding:16px 18px 8px;line-height:1.25}
.sf-art>div{padding:0 18px;font-size:16px;line-height:1.62;color:#222;user-select:text}
.sf-btn{margin:20px 18px 0;background:#0a84ff!important;color:#fff;height:44px;border-radius:11px;width:calc(100% - 36px);font-weight:600}
.sf-real{display:flex;align-items:center;gap:4px;margin:18px;color:#0a84ff;font-size:14px;text-decoration:none}

/* =================== 에디터 패널 / 모달 / FAB =================== */
#panel{width:380px;flex-shrink:0;height:100%;background:var(--pn-bg);border-left:1px solid var(--pn-line);display:flex;flex-direction:column;z-index:200;color:var(--pn-fg)}
.pn-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px;padding-top:max(16px,env(safe-area-inset-top,0px))}
.pn-h b{font-size:17px;letter-spacing:.2px}
.pn-h button,.mdl-x{background:var(--pn-card);border:1px solid var(--pn-line);border-radius:10px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--pn-fg)}
.pn-tabs{display:flex;gap:4px;margin:0 14px 6px;padding:3px;background:var(--pn-card);border-radius:11px}
.pn-tabs button{flex:1;border:0;background:none;color:var(--pn-mute);padding:8px 0;border-radius:8px;font-size:13px;font-weight:600}
.pn-tabs button.on{background:#33363f;color:var(--pn-fg)}
.pn-b{flex:1;overflow-y:auto;padding:4px 14px 90px}
.pn-b section{padding:14px 2px;border-bottom:1px solid var(--pn-line);display:flex;flex-direction:column;gap:9px}
.pn-b h4{margin:0;font-size:12px;letter-spacing:.8px;color:var(--accent);font-weight:700}
.pn-b label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--pn-mute)}
.pn-b label b{color:var(--pn-fg)}
.pn-b input:not([type=checkbox]):not([type=range]),.pn-b select,.pn-b textarea,.mdl input:not([type=checkbox]):not([type=color]),.mdl select,.mdl textarea{background:var(--pn-card);border:1px solid var(--pn-line);color:var(--pn-fg);border-radius:9px;padding:9px 10px;width:100%;font:inherit;font-size:14px;outline:none}
.pn-b input:focus,.pn-b select:focus,.pn-b textarea:focus,.mdl input:focus,.mdl select:focus,.mdl textarea:focus{border-color:var(--accent)}
.pn-b input[type=range]{accent-color:var(--accent);width:100%}
.pn-b textarea,.mdl textarea{resize:vertical;line-height:1.45}
.pn-hint{margin:0;font-size:12.5px;line-height:1.5;color:var(--pn-mute)}
.pn-hint b{color:var(--pn-fg)}
.pn-g2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
label.pn-sw,.ff-sw2{flex-direction:row!important;align-items:center;gap:9px!important;color:var(--pn-fg)!important;font-size:13.5px!important;cursor:pointer}
.pn-sw input,.ff-sw2 input{position:absolute;opacity:0;width:0;height:0}
.pn-sw span,.ff-sw2 span{width:36px;height:21px;border-radius:11px;background:#3a3c45;position:relative;flex-shrink:0;transition:background .2s}
.pn-sw span::after,.ff-sw2 span::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s}
.pn-sw input:checked+span,.ff-sw2 input:checked+span{background:#34c759}
.pn-sw input:checked+span::after,.ff-sw2 input:checked+span::after{transform:translateX(15px)}
.pn-sw input:focus-visible+span,.ff-sw2 input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pn-btns{display:flex;flex-wrap:wrap;gap:7px}
.pn-btns.col{flex-direction:column}
.pn-btns button,.pn-list button,.ff-btns button,.mdl-sec{background:var(--pn-card);border:1px solid var(--pn-line);color:var(--pn-fg);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.pn-btns button:hover,.pn-list button:hover,.ff-btns button:hover,.mdl-sec:hover{border-color:#4a4d58}
.pn-btns button.pri,.mdl-ok{background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:9px;padding:8px 16px;font-size:13.5px;font-weight:700}
.pn-btns button.danger{color:#ff6b61}
.pn-list{display:flex;flex-direction:column;gap:6px}
.pn-list button{justify-content:flex-start;text-align:left;font-weight:500}
.pn-list button small{color:var(--pn-mute);margin-left:auto}
.pn-list button.add{border-style:dashed;color:var(--accent)}
.pn-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pn-apps button{background:none;border:0;color:var(--pn-fg);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;padding:6px 0;border-radius:10px}

/* ---------- 상태 로드/저장 ---------- */
let EMBED = null;
try { const t = $('#sim-data')?.textContent?.trim(); if (t && t !== 'null') EMBED = JSON.parse(t); } catch (e) { console.warn('embedded data parse fail', e); }
const SKEY = 'iphsim:' + (EMBED?.meta?.id || 'main');
function deepFill(t, d) {
  for (const k in d) {
    if (t[k] === undefined || t[k] === null) t[k] = deep(d[k]);
    else if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && typeof t[k] === 'object' && !Array.isArray(t[k])) deepFill(t[k], d[k]);
  }
  return t;
}
let S = null;
try { const raw = localStorage.getItem(SKEY); if (raw) S = JSON.parse(raw); } catch (e) { }
if (!S) S = EMBED ? deep(EMBED) : makeDefault();
deepFill(S, makeDefault());
if (EMBED?.sys?.readonly) { S.sys.readonly = true; S.sys.editor = false; }

let saveTimer = null, quotaWarned = false;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(SKEY, JSON.stringify(S)); quotaWarned = false; }
    catch (e) {
      if (!quotaWarned) { quotaWarned = true; toast('브라우저 저장 공간이 가득 찼어요. [HTML로 저장] 또는 JSON 백업으로 보관하세요. (큰 이미지·영상은 URL 사용 권장)', 5200); }
    }
  }, 250);
}
const editorOn = () => S.sys.editor && !S.sys.readonly;

/* ---------- 파일 / 이미지 ---------- */
function pickFiles(accept = 'image/*', multiple = false) {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept; inp.multiple = multiple;
    inp.style.display = 'none'; document.body.appendChild(inp);
    inp.onchange = () => { res([...inp.files]); inp.remove(); };
    inp.click();
    setTimeout(() => { if (!inp.files?.length) { /* 취소 시 정리 */ } }, 60000);
  });
}
function readAsDataURL(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); }); }
async function fileToSrc(file, max = 1280, q = 0.84) {
  if (!file) return '';
  if (file.type.startsWith('image/') && !/gif|svg/.test(file.type)) {
    try {
      const url = URL.createObjectURL(file);
      const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const sc = Math.min(1, max / Math.max(im.width, im.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      return cv.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', q);
    } catch (e) { return readAsDataURL(file); }
  }
  if (file.size > 12 * 1024 * 1024) toast('파일이 커서 저장이 실패할 수 있어요. 가능하면 URL을 사용하세요.', 4000);
  return readAsDataURL(file);
}

const SND = {
  ctx: null, noise: null, alt: false,
  get c() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) { return null; }
  },
  get v() { return clamp(num(S.sys.volume ?? 70), 0, 100) / 100; },
  noiseBuf(c) {
    if (this.noise) return this.noise;
    const b = c.createBuffer(1, c.sampleRate * 0.05, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    return (this.noise = b);
  },
  env(g, t, peak, a, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  tone(freq, start, dur, peak = 0.2, type = 'sine') {
    const c = this.c; if (!c) return; const t = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = freq;
    this.env(g, t, peak * this.v, 0.008, dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
};
// 키보드 타자음: 낮고 묵직한 '톡' — 저역 사인 펄스 + 대역통과 노이즈
function sKey(kind = 'k') {
  if (!S.sys.keySound) return;
  const c = SND.c; if (!c) return; const t = c.currentTime, v = SND.v;
  SND.alt = !SND.alt;
  const base = kind === 'del' ? 120 : kind === 'sp' ? 135 : (SND.alt ? 168 : 152);
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base * 0.5, t + 0.045);
  SND.env(g, t, 0.32 * v, 0.0015, 0.05); o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.07);
  const n = c.createBufferSource(); n.buffer = SND.noiseBuf(c);
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = (kind === 'del' ? 1100 : 1500) + (SND.alt ? 0 : 160); f.Q.value = 0.9;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
  const g2 = c.createGain(); SND.env(g2, t, 0.14 * v, 0.001, 0.022);
  n.connect(f).connect(lp).connect(g2).connect(c.destination); n.start(t); n.stop(t + 0.04);
}
function sNotify(kind = 'msg') {
  if (!S.sys.sound) return;
  if (kind === 'msg') { SND.tone(1174.7, 0, .28, .16); SND.tone(2349.3, 0, .18, .03); SND.tone(1568, .12, .45, .16); SND.tone(3136, .12, .25, .025); }
  else if (kind === 'mail') { SND.tone(880, 0, .2, .12, 'triangle'); SND.tone(1318.5, .09, .35, .12, 'triangle'); }
  else if (kind === 'alarm') { for (let i = 0; i < 6; i++) { SND.tone(1046.5, i * .32, .12, .2, 'square'); SND.tone(1318.5, i * .32 + .14, .12, .16, 'square'); } }
  else if (kind === 'ring') { for (let i = 0; i < 4; i++) { SND.tone(784, i * .45, .16, .18); SND.tone(988, i * .45 + .16, .2, .18); } }
  else if (kind === 'done') { SND.tone(1568, 0, .2, .15); SND.tone(1318.5, .12, .2, .15); SND.tone(1568, .24, .4, .15); }
}
function sClick(kind = 'lock') {
  if (!S.sys.sound) return;
  const c = SND.c; if (!c) return; const t = c.currentTime;
  const n = c.createBufferSource(); n.buffer = SND.noiseBuf(c);
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = kind === 'lock' ? 900 : 2200;
  const g = c.createGain(); SND.env(g, t, 0.35 * SND.v, 0.001, kind === 'lock' ? 0.06 : 0.03);
  n.connect(f).connect(g).connect(c.destination); n.start(t); n.stop(t + 0.1);
}

/* ---------- 배지 & 알림 집계 ---------- */
function kRoomName(r) {
  if (r.name) return r.name;
  const names = r.members.map(id => byId(S.kakao.friends, id)?.name || '알 수 없음');
  return r.type === 'dm' ? names[0] : names.join(', ');
}
function kLastOther(r) { for (let i = r.messages.length - 1; i >= 0; i--) if (r.messages[i].from !== 'me' && r.messages[i].type !== 'sys') return r.messages[i]; return null; }
function msgPreview(m) { if (!m) return ''; return m.type === 'image' ? '사진을 보냈습니다.' : m.type === 'sys' ? m.text : m.text; }
function badgeCount(app) {
  switch (app) {
    case 'kakao': return S.kakao.rooms.reduce((a, r) => a + num(r.unread), 0);
    case 'phone': return S.phone.calls.filter(c => c.type === 'missed' && !c.seen).reduce((a, c) => a + Math.max(1, num(c.count)), 0);
    case 'gmail': return S.gmail.mails.filter(m => m.folder === 'inbox' && m.unread).length;
    case 'insta': return S.insta.dms.filter(d => d.unread).length;
    case 'bubble': return S.bubble.rooms.reduce((a, r) => a + num(r.unread), 0);
    case 'tw': return S.tw.notifs.filter(n => n.unread).length + S.tw.dms.filter(d => d.unread).length;
    case 'settings': return 0;
    default: return 0;
  }
}
function iUser(id) { if (id === 'me') return { id: 'me', handle: S.insta.me.handle, name: S.insta.me.name, avatar: S.insta.me.avatar }; return byId(S.insta.users, id) || { id, handle: 'unknown', name: '알 수 없음', avatar: '' }; }
function collectNotifs() {
  const out = [];
  S.kakao.rooms.forEach(r => {
    if (num(r.unread) > 0) {
      const m = kLastOther(r); if (!m) return;
      const f = byId(S.kakao.friends, m.from);
      out.push({ key: 'k' + r.id, app: 'kakao', title: r.type === 'group' ? kRoomName(r) : (f?.name || kRoomName(r)), sub: r.type === 'group' ? (f?.name || '') : '', body: msgPreview(m), date: m.date, time: m.time, count: num(r.unread), open: ['kakao', 'room', { id: r.id }], av: av(f?.avatar, f?.name) });
    }
  });
  S.bubble.rooms.forEach(r => {
    if (num(r.unread) > 0) { const m = [...r.msgs].reverse().find(x => x.from === 'artist'); if (m) out.push({ key: 'b' + r.id, app: 'bubble', title: r.artist, sub: r.group, body: bbPreview(r, m), date: m.date, time: m.time, count: num(r.unread), open: ['bubble', 'room', { id: r.id }], av: av(r.avatar, r.artist) }); }
  });
  S.tw.dms.forEach(d => {
    if (d.unread) { const u = twU(d.user); const last = [...d.msgs].reverse().find(m => m.from === 'them'); out.push({ key: 't' + d.id, app: 'tw', title: u.name, body: last ? last.text : '새 쪽지', date: d.date, time: d.time, open: ['tw', 'dmroom', { id: d.id }], av: av(u.avatar, u.name) }); }
  });
  S.tw.notifs.forEach(x => {
    if (x.unread) { const u = twU(x.user); out.push({ key: 'tn' + x.id, app: 'tw', title: u.name, body: twNotifLine(x), date: x.date, time: x.time, open: ['tw', 'notifs', {}], av: av(u.avatar, u.name) }); }
  });
  S.insta.dms.forEach(d => {
    if (d.unread) { const u = iUser(d.user); const last = [...d.msgs].reverse().find(m => m.from === 'them'); out.push({ key: 'i' + d.id, app: 'insta', title: u.handle, body: last ? last.text : '새 메시지', date: d.date, time: d.time, open: ['insta', 'dmroom', { id: d.id }], av: av(u.avatar, u.name) }); }
  });
  S.gmail.mails.forEach(m => {
    if (m.folder === 'inbox' && m.unread) out.push({ key: 'g' + m.id, app: 'gmail', title: m.from, body: m.subject + '\n' + String(m.body).split('\n').filter(Boolean)[0], date: m.date, time: m.time, open: ['gmail', 'mail', { id: m.id }] });
  });
  S.phone.calls.forEach(c => {
    if (c.type === 'missed' && !c.seen) out.push({ key: 'p' + c.id, app: 'phone', title: c.name || c.number, body: `부재중 전화${num(c.count) > 1 ? ` (${c.count})` : ''}`, date: c.date, time: c.time, open: ['phone', 'main', { tab: 'recents' }] });
  });
  // 오늘 남은 캘린더 일정 1개
  const now = sysNow(), t = todayStr();
  const ev = S.calendar.events.filter(e => e.date === t && !e.allDay && tsOf(e.date, e.start) >= now.getTime() - 60000 && tsOf(e.date, e.start) - now.getTime() < 3 * 3600000).sort((a, b) => a.start.localeCompare(b.start))[0];
  if (ev) out.push({ key: 'c' + ev.id, app: 'calendar', title: ev.title, body: `${ampm(ev.start)}–${ampm(ev.end)}${ev.loc ? '\n' + ev.loc : ''}`, date: t, time: hm(new Date(now.getTime() - 60000 * 5)), open: ['calendar', 'month', { sel: ev.date }] });
  (S.notifs || []).forEach(n => out.push({ key: 'x' + n.id, app: n.app, title: n.title, body: n.body, date: n.date, time: n.time, custom: n, open: null, editKey: 'notif|' + n.id }));
  return out.sort((a, b) => tsOf(b.date, b.time) - tsOf(a.date, a.time));
}
function notifIcon(n, size = 38) {
  if (APPDEF[n.app]) return appIcon(n.app, size);
  const c = n.custom;
  if (c?.icon) return `<div class="aicon" style="width:${size}px;height:${size}px"><img src="${esc(img(c.icon))}" alt=""></div>`;
  return `<div class="aicon" style="width:${size}px;height:${size}px;background:linear-gradient(160deg,#5e5ce6,#3634a3)"><b style="color:#fff;font-size:${size * .42}px">${esc((n.app || '?')[0])}</b></div>`;
}
function appLabel(n) { return APPDEF[n.app]?.name || n.app || '알림'; }

/* ---------- 다이나믹 아일랜드 ---------- */
function islandBase() {
  if (U.call?.incoming && !U.locked && !U.call.full) return 'call';
  if (Player.track() && (Player.playing || Player.started)) return 'music';
  if (U.timer && (U.timer.running || U.timer.paused)) return 'timer';
  return 'idle';
}
function waveHTML(n = 5) { return `<span class="wave ${Player.playing ? 'on' : ''}">${Array.from({ length: n }, (_, i) => `<i style="animation-delay:${(i * .13).toFixed(2)}s"></i>`).join('')}</span>`; }
function timerLeft() { if (!U.timer) return 0; return U.timer.running ? Math.max(0, U.timer.endAt - Date.now()) : U.timer.remain; }
function fmtDur(ms) { const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return h ? `${h}:${pad2(m)}:${pad2(ss)}` : `${m}:${pad2(ss)}`; }
function fmtSec(s) { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${pad2(s % 60)}`; }
function renderIsland() {

function pinHTML() {

const APPS = {}; // id -> { root, views:{}, leave(top), enter }
function curView() { return U.stack[U.stack.length - 1]; }
function openApp(id, view, params) {
  if (!APPS[id]) return;
  if (U.locked) { U.pendingOpen = [id, view, params]; startUnlock(); return; }
  if (U.app && U.app !== id) leaveHook();
  const layer = $('#appLayer');
  const fresh = U.app !== id;
  U.app = id;
  const root = APPS[id].root;
  U.stack = view && view !== root ? [{ v: root, p: {} }, { v: view, p: params || {} }] : [{ v: root, p: params || {} }];
  APPS[id].enter?.(curView());
  U.scrollBottom = true;
  renderApp();
  if (fresh) {
    const iconEl = $(`#home [data-app="${id}"] .aicon`);
    const sr = $('#screen').getBoundingClientRect();
    const scale = sr.width / $('#screen').offsetWidth || 1;
    if (iconEl) { const r = iconEl.getBoundingClientRect(); layer.style.transformOrigin = `${(r.left + r.width / 2 - sr.left) / scale}px ${(r.top + r.height / 2 - sr.top) / scale}px`; }
    else layer.style.transformOrigin = '50% 50%';
    layer.hidden = false;
    layer.classList.remove('open'); void layer.offsetWidth; layer.classList.add('open');
  }
  renderStatus();
}
function closeApp(instant) {
  if (!U.app) return;
  leaveHook();
  const layer = $('#appLayer'), id = U.app;
  const iconEl = $(`#home [data-app="${id}"] .aicon`);
  if (iconEl && !instant) {
    const sr = $('#screen').getBoundingClientRect(), scale = sr.width / $('#screen').offsetWidth || 1, r = iconEl.getBoundingClientRect();
    layer.style.transformOrigin = `${(r.left + r.width / 2 - sr.left) / scale}px ${(r.top + r.height / 2 - sr.top) / scale}px`;
  }
  U.app = null; U.stack = []; closeSheet(true); vbClear(); reelStop();
  if (instant) { layer.hidden = true; layer.classList.remove('open', 'closing'); }
  else { layer.classList.remove('open'); layer.classList.add('closing'); setTimeout(() => { if (!U.app) { layer.hidden = true; } layer.classList.remove('closing'); }, 380); }
  renderHome(); renderStatus();
}
function leaveHook() { const a = APPS[U.app], top = curView(); if (a?.leave && top) a.leave(top); }
function push(v, p = {}) { leaveHook(); U.stack.push({ v, p }); U.scrollBottom = true; renderApp('push'); }
function back() {
  if (U.stack.length > 1) { leaveHook(); U.stack.pop(); renderApp('pop'); }
  else closeApp();
}
function replaceView(v, p = {}) { leaveHook(); U.stack[U.stack.length - 1] = { v, p }; U.scrollBottom = true; renderApp(); }
function renderApp(anim) {
  const host = $('#appView'); if (!host || !U.app) return;
  const app = APPS[U.app], top = curView();
  const viewFn = app.views[top.v] || app.views[app.root];
  // 포커스 & 스크롤 보존
  const ae = document.activeElement, focusId = ae && host.contains(ae) && ae.id ? ae.id : null;
  let selS = null, selE = null; try { if (focusId) { selS = ae.selectionStart; selE = ae.selectionEnd; } } catch (e) { }
  reelStop();
  const scrolls = {}; $$('[data-sk]', host).forEach(e => scrolls[e.dataset.sk] = e.scrollTop);
  host.innerHTML = viewFn(top.p || {});
  const root = host.firstElementChild;
  if (root && anim === 'push') root.classList.add('anim-push');
  if (root && anim === 'pop') root.classList.add('anim-pop');
  $$('[data-sk]', host).forEach(e => { if (scrolls[e.dataset.sk] != null && !anim) e.scrollTop = scrolls[e.dataset.sk]; });
  if (U.scrollBottom) { $$('[data-bottom]', host).forEach(e => e.scrollTop = e.scrollHeight); U.scrollBottom = false; requestAnimationFrame(() => $$('[data-bottom]', host).forEach(e => e.scrollTop = e.scrollHeight)); }
  if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus({ preventScroll: true }); try { if (selS != null) f.setSelectionRange(selS, selE); } catch (e) { } } }
  app.mounted?.(top, host);
  vbPlace();
  renderStatus();
}

  if (r.type === 'dm') return `<img class="kk-rav" style="width:${size}px;height:${size}px" src="${esc(kAv(r.members[0]))}" alt="">`;
  const ms = r.members.slice(0, 4), n = ms.length;
  return `<div class="kk-gav n${n}" style="width:${size}px;height:${size}px">${ms.map(id => `<img src="${esc(kAv(id))}" alt="">`).join('')}</div>`;
}
function kSorted() {
  return [...S.kakao.rooms].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (kLast(b) ? tsOf(kLast(b).date, kLast(b).time) : 0) - (kLast(a) ? tsOf(kLast(a).date, kLast(a).time) : 0));
}

function autoGrow(t) { if (!t) return; t.style.height = 'auto'; const h = t.scrollHeight; if (h > 0) t.style.height = Math.min(110, Math.max(36, h)) + 'px'; else t.style.height = ''; }
INP.kkLive = el => { autoGrow(el); const b = $('.kk-send'); if (b) { const on = !!el.value.trim(); if (on !== b.classList.contains('on')) { b.classList.toggle('on', on); b.innerHTML = on ? ic('send', 20) : ic('hash', 20); } } };

ACT.kSender = el => { U.kSender = el.dataset.id; renderApp(); };
function kSendMsg(r, from, msg) {
  const n = sysNow();
  const m = Object.assign({ id: uid(), from, type: 'text', text: '', date: ymd(n), time: hm(n), unread: 0 }, msg);
  if (from === 'me' && msg.unread === undefined) m.unread = r.type === 'dm' ? (r.members[0] === 'me' ? 0 : 1) : r.members.length;
  if (from !== 'me' && r.type === 'dm') r.messages.forEach(x => { if (x.from === 'me') x.unread = 0; });
  r.messages.push(m);
  return m;
}
ACT.kSend = el => {
  const r = byId(S.kakao.rooms, curView().p.id); if (!r) return;
  const key = 'kk:' + r.id, text = (U.drafts[key] || '').trim(); if (!text) return;
  kSendMsg(r, U.kSender || 'me', { text });
  U.drafts[key] = ''; U.scrollBottom = true;
  const ta = $('#kkIn'); if (ta) ta.value = '';
  commit(); $('#kkIn')?.focus();
};
KEY.kSend = el => ACT.kSend(el);
ACT.kAttach = el => {
  const r = byId(S.kakao.rooms, el.dataset.id);

ACT.kDmWith = el => {
  const id = el.dataset.id;

  if (!r) { r = { id: uid(), type: 'dm', members: [id], name: id === 'me' ? S.kakao.me.name : '', avatar: '', unread: 0, pinned: false, muted: false, bg: '', messages: [] }; S.kakao.rooms.push(r); save(); }

ACT.kAI = async el => {
  const r = byId(S.kakao.rooms, el.dataset.id);
  const who = U.kSender !== 'me' ? U.kSender : r.members[0];
  if (who === 'me') return toast('상대 역할이 없어요');
  el.disabled = true; el.innerHTML = '생성 중…';
  try {
    const hist = r.messages.filter(m => m.type === 'text').slice(-24).map(m => ({ me: m.from !== who, text: (r.type === 'group' && m.from !== who ? `${kName(m.from)}: ` : '') + m.text }));
    const text = await aiReply(kName(who), hist, r.type === 'group' ? `단체 채팅방 「${kRoomName(r)}」` : '카카오톡 1:1 채팅');
    if (text) { text.split(/\n{2,}|\n(?=\S)/).filter(Boolean).slice(0, 3).forEach(t => kSendMsg(r, who, { text: t.trim() })); U.scrollBottom = true; commit(); }
  } catch (e) { toast('AI 답장 실패: ' + e.message, 4200); renderApp(); }
};

function normUrl(u) { return String(u || '').trim().replace(/^https?:\/\//, '').replace(/\/$/, ''); }
function sfPage(url) {
  const u = normUrl(url);
  return S.safari.pages.find(p => normUrl(p.url) === u);
}
function sfNavigate(input) {
  const q = String(input || '').trim(); if (!q) return;
  const isUrl = /^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q) && !q.includes(' ');
  const n = sysNow();
  let url, title;
  if (isUrl) { url = normUrl(q); const pg = sfPage(url); title = pg?.title || url.split('/')[0]; }
  else {
    url = 'search.nuri.kr/?q=' + encodeURIComponent(q); title = `${q} - 누리 검색`;
    S.safari.searches = S.safari.searches.filter(s => s.q !== q); S.safari.searches.unshift({ id: uid(), q }); S.safari.searches = S.safari.searches.slice(0, 12);
  }
  S.safari.history.unshift({ id: uid(), title, url, date: ymd(n), time: hm(n) });
  S.safari.history = S.safari.history.slice(0, 60);
  S.safari.tab = { url, title };
  U.drafts.sfAddr = ''; U.sfFocus = false;
  save();
  if (curView().v === 'page') { curView().p = { url }; renderApp(); } else push('page', { url });
}

function ytId(u) { const m = String(u || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/); return m ? m[1] : null; }
const Player = {
  idx: -1, playing: false, started: false, simPos: 0, simT: null, audio: null, yt: null, ytInfo: { t: 0, d: 0 }, ytReady: false,
  track() { return S.music.tracks[this.idx] || null; },
  kind(t = this.track()) { if (!t?.url) return 'sim'; if (ytId(t.url)) return 'yt'; return 'audio'; },
  pos() { const k = this.kind(); if (k === 'audio') return this.audio?.currentTime || 0; if (k === 'yt') return this.ytInfo.t || 0; return this.simPos; },
  dur() { const t = this.track(); if (!t) return 0; const k = this.kind(); if (k === 'audio') return isFinite(this.audio?.duration) ? this.audio.duration : num(t.dur); if (k === 'yt') return this.ytInfo.d || num(t.dur); return num(t.dur) || 180; },
  stopAll() {
    clearInterval(this.simT);
    if (this.audio) { this.audio.pause(); }
    if (this.yt) { this.yt.remove(); this.yt = null; this.ytReady = false; }
    $('#ytBox')?.classList.remove('on');
  },
  play(i) {
    if (i !== undefined && i !== this.idx) { this.stopAll(); this.idx = i; this.simPos = 0; this.ytInfo = { t: 0, d: 0 }; this.load(); }
    const t = this.track(); if (!t) return;
    this.started = true; this.playing = true;
    const k = this.kind();
    if (k === 'audio') { this.audio.play().catch(e => { toast('오디오를 재생할 수 없어요. URL을 확인하세요.'); this.playing = false; this.ui(); }); }
    else if (k === 'yt') { if (this.yt && this.ytReady) this.ytCmd('playVideo'); }
    else { clearInterval(this.simT); this.simT = setInterval(() => { this.simPos += 0.5; if (this.simPos >= this.dur()) this.next(); this.tick(); }, 500); }
    this.ui();
  },
  load() {
    const t = this.track(); if (!t) return;
    const k = this.kind();
    if (k === 'audio') {
      if (!this.audio) { this.audio = new Audio(); this.audio.preload = 'auto'; this.audio.addEventListener('timeupdate', () => this.tick()); this.audio.addEventListener('ended', () => this.next()); this.audio.addEventListener('loadedmetadata', () => this.tick()); }
      this.audio.src = t.url; this.audio.volume = SND.v;
    } else if (k === 'yt') {
      const box = $('#ytBox');
      box.innerHTML = `<button class="yt-x" data-act="mStop">${ic('x', 14)}</button>`;
      const f = document.createElement('iframe');
      f.allow = 'autoplay; encrypted-media; picture-in-picture'; f.title = 'YouTube';
      f.src = `https://www.youtube.com/embed/${ytId(t.url)}?autoplay=1&enablejsapi=1&playsinline=1&controls=1&rel=0&origin=${encodeURIComponent(location.origin === 'null' ? '*' : location.origin)}`;
      f.onload = () => { this.ytReady = true; try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'simyt', channel: 'widget' }), '*'); } catch (e) { } this.ytCmd('setVolume', [S.sys.volume]); };
      box.appendChild(f); box.classList.add('on'); this.yt = f;
      placeYT();
    }
  },
  ytCmd(func, args = []) { try { this.yt?.contentWindow?.postMessage(JSON.stringify({ event: 'command', func, args }), '*'); } catch (e) { } },
  pause() {
    this.playing = false;
    const k = this.kind();
    if (k === 'audio') this.audio?.pause(); else if (k === 'yt') this.ytCmd('pauseVideo'); else clearInterval(this.simT);
    this.ui();
  },
  toggle() { if (this.idx < 0) return this.play(0); this.playing ? this.pause() : this.play(); },
  next() { const n = S.music.tracks.length; if (!n) return; this.play(this.shuffle ? Math.floor(Math.random() * n) : (this.idx + 1) % n); },
  prev() { if (this.pos() > 3) return this.seek(0); const n = S.music.tracks.length; if (!n) return; this.play((this.idx - 1 + n) % n); },
  seek(sec) { const k = this.kind(); if (k === 'audio' && this.audio) this.audio.currentTime = sec; else if (k === 'yt') { this.ytCmd('seekTo', [sec, true]); this.ytInfo.t = sec; } else this.simPos = sec; this.tick(); },
  stop() { this.stopAll(); this.playing = false; this.started = false; this.idx = -1; this.ui(); },
  ui() { renderIsland(); if (U.locked) renderLock(); if (U.app === 'music') renderApp(); else placeYT(); },
  tick() {
    // 가벼운 갱신: 진행바만
    const p = this.pos(), d = this.dur() || 1, pct = (p / d * 100).toFixed(2) + '%';
    $$('.m-prog-fill,.di-bar i,.lkm-bar i,.mini-prog i').forEach(e => e.style.width = pct);
    $$('.m-t-cur').forEach(e => e.textContent = fmtSec(p)); $$('.m-t-left').forEach(e => e.textContent = '-' + fmtSec(d - p));
    const di = $('.di-prog span:first-child'); if (di) di.textContent = fmtSec(p);
    const dl = $('.di-prog span:last-child'); if (dl) dl.textContent = '-' + fmtSec(d - p);
  }
};
window.addEventListener('message', e => {
  if (!/youtube\.com$/.test(String(e.origin).replace(/^https?:\/\/(www\.)?/, '').split(':')[0]) && !/youtube/.test(e.origin)) return;
  try {
    const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    if (d?.info) {
      if (d.info.currentTime != null) Player.ytInfo.t = d.info.currentTime;
      if (d.info.duration) Player.ytInfo.d = d.info.duration;
      if (d.info.playerState === 0) Player.next();
      if (d.info.playerState === 1 && !Player.playing) { Player.playing = true; Player.ui(); }
      if (d.info.playerState === 2 && Player.playing) { Player.playing = false; Player.ui(); }
      Player.tick();
    }
  } catch (err) { }
});
function placeYT() {
  const box = $('#ytBox'); if (!box || !Player.yt) return;
  const art = $('#appView .np-art');
  if (art && U.app === 'music' && !U.locked) {
    const sc = $('#screen'), r = art.getBoundingClientRect(), sr = sc.getBoundingClientRect(), k = sr.width / sc.offsetWidth;
    box.className = 'on np'; box.style.cssText = `left:${(r.left - sr.left) / k}px;top:${(r.top - sr.top) / k}px;width:${r.width / k}px;height:${r.height / k}px`;
  } else { box.className = 'on pip' + (U.locked ? ' hide' : ''); box.style.cssText = ''; }
}

function mapApplyVB() { const svg = $('#mapSvg'); if (!svg) return; const vb = mapW2V(); svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function mapBind() {
  const svg = $('#mapSvg'); if (!svg || svg.dataset.bound) return; svg.dataset.bound = 1;
  let st = null, lp = null;
  const toWorld = (cx, cy) => { const r = svg.getBoundingClientRect(), vb = mapW2V(); const sc = Math.max(vb.w / r.width, vb.h / r.height); const ox = (r.width * sc - vb.w) / 2, oy = (r.height * sc - vb.h) / 2; return { x: vb.x - ox + (cx - r.left) * sc, y: vb.y - oy + (cy - r.top) * sc }; };
  svg.addEventListener('pointerdown', e => {
    st = { x: e.clientX, y: e.clientY, vx: U.mapView.x, vy: U.mapView.y, moved: false };
    svg.setPointerCapture(e.pointerId);
    clearTimeout(lp);
    lp = setTimeout(() => { if (st && !st.moved && !e.target.closest('[data-place],[data-pin]')) { const w = toWorld(st.x, st.y); const p = { id: uid(), x: Math.round(w.x), y: Math.round(w.y + 2), name: '새로운 핀', note: '', fav: false }; S.map.pins.push(p); U.mapSel = { type: 'pin', id: p.id }; haptic(20); st = null; commit(); } }, 550);
  });
  svg.addEventListener('pointermove', e => {
    if (!st) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) { st.moved = true; clearTimeout(lp); }
    if (st.moved) { const r = svg.getBoundingClientRect(), vb = mapW2V(), sc = Math.max(vb.w / r.width, vb.h / r.height); U.mapView.x = st.vx - dx * sc; U.mapView.y = st.vy - dy * sc; mapApplyVB(); }
  });
  svg.addEventListener('pointerup', e => {
    clearTimeout(lp);
    if (!st) return; const moved = st.moved; st = null;
    if (moved) return;
    const pl = e.target.closest('[data-place]'), pn = e.target.closest('[data-pin]');
    if (pn) { const [k, id] = pn.dataset.pin.split(':'); U.mapSel = k === 'pin' ? { type: 'pin', id } : { type: 'place', id }; haptic(6); renderApp(); }

    else if (U.mapSel) { U.mapSel = null; renderApp(); }
  });
  svg.addEventListener('pointercancel', () => { clearTimeout(lp); st = null; });
  svg.addEventListener('wheel', e => { e.preventDefault(); U.mapView.z = clamp(U.mapView.z * (e.deltaY < 0 ? 1.1 : 0.9), 0.6, 5); mapApplyVB(); }, { passive: false });

function formCollect() {

  $$('[data-ff]', host).forEach(e => {
    const k = e.dataset.ff, f = FORM.spec.fields.find(x => x.k === k); if (!f) return;

    else if (f.t === 'number') FORM.vals[k] = e.value === '' ? 0 : Number(e.value);
    else if (f.t === 'image' || f.t === 'media') { if (e.value !== '(업로드한 파일)') FORM.vals[k] = e.value.trim(); }

/* ---------- AI 키 (AES-GCM 암호화 → localStorage, 키는 IndexedDB 비추출) ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const AIKEY = {
  has: false, mem: null, LS: 'iphsim:aikey',
  init() { try { this.has = !!localStorage.getItem(this.LS); } catch (e) { } },
  db() { return new Promise((res, rej) => { const r = indexedDB.open('iphsim-secure', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async cryptoKey() {
    const db = await this.db();
    const tx = (mode, fn) => new Promise((res, rej) => { const q = fn(db.transaction('k', mode).objectStore('k')); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    let key = await tx('readonly', s => s.get('aes'));
    if (!key) { key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); await tx('readwrite', s => s.put(key, 'aes')); }
    return key;
  },
  async save(plain) {
    try {
      const key = await this.cryptoKey(), iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plain));
      localStorage.setItem(this.LS, JSON.stringify({ iv: b64(iv), ct: b64(ct) }));
      this.mem = null; this.has = true; return 'stored';
    } catch (e) { this.mem = plain; this.has = true; return 'memory'; }
  },
  async get() {
    if (this.mem) return this.mem;
    const raw = localStorage.getItem(this.LS); if (!raw) return null;
    const { iv, ct } = JSON.parse(raw); const key = await this.cryptoKey();
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, key, unb64(ct)));
  },
  del() { try { localStorage.removeItem(this.LS); } catch (e) { } this.has = false; this.mem = null; }
};
async function aiReply(name, hist, ctx) {
  const key = await AIKEY.get(); if (!key) throw new Error('API 키가 없어요 (설정 > AI 연동)');
  const sys = `너는 ${ctx}에서 '${name}' 역할로 답장한다.${S.ai.persona ? '\n캐릭터 설정: ' + S.ai.persona : ''}\n규칙: 실제 메신저처럼 짧고 자연스러운 한국어 구어체로 1~3개의 짧은 메시지를 쓴다. 메시지마다 줄을 바꾼다. 따옴표·이름표·설명 없이 메시지 내용만 출력한다.`;
  const messages = [{ role: 'system', content: sys }, ...hist.map(h => ({ role: h.me ? 'user' : 'assistant', content: h.text }))];
  if (messages.length === 1 || messages[messages.length - 1].role === 'assistant') messages.push({ role: 'user', content: '(상대가 이어서 말하는 상황)' });
  const r = await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key }, body: JSON.stringify({ model: S.ai.model || 'gpt-4o-mini', messages, temperature: 0.9, max_tokens: 220 }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error?.message || 'HTTP ' + r.status);
  return String(j.choices?.[0]?.message?.content || '').trim();
}
