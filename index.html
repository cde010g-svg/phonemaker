function simIncoming(o) {
  const go = () => {
    const viewing = (app, v, id) => !U.locked && U.app === app && curView()?.v === v && curView()?.p?.id === id;
    if (o.app === 'kakao') {
      const r = byId(S.kakao.rooms, o.target); if (!r) return toast('채팅방을 찾을 수 없어요');
      const from = r.members.includes(o.from) ? o.from : r.members[0];
      const m = kSendMsg(r, from, o.img ? { type: 'image', img: o.img } : { text: o.text || '…' });
      const see = viewing('kakao', 'room', r.id);
      if (!see) r.unread = num(r.unread) + 1; else U.scrollBottom = true;
      const f = byId(S.kakao.friends, from);
      if (r.muted || see) { if (see) sNotify('msg'); commit(); return; }
      deliver({ app: 'kakao', title: r.type === 'group' ? kRoomName(r) : f?.name, body: (r.type === 'group' ? f?.name + ': ' : '') + msgPreview(m), open: ['kakao', 'room', { id: r.id }], av: av(f?.avatar, f?.name) }, 'msg');
    } else if (o.app === 'insta') {
      const d = byId(S.insta.dms, o.target); if (!d) return toast('DM을 찾을 수 없어요');
      iSendDM(d, 'them', { text: o.text || '…' });
      const see = viewing('insta', 'dmroom', d.id);
      if (!see) d.unread = true; else U.scrollBottom = true;
      const u = iUser(d.user);
      if (see) { sNotify('msg'); commit(); return; }
      deliver({ app: 'insta', title: u.handle, body: o.text, open: ['insta', 'dmroom', { id: d.id }], av: av(u.avatar, u.name) }, 'msg');
    } else if (o.app === 'bubble') {
      const r = byId(S.bubble.rooms, o.target); if (!r) return toast('아티스트를 찾을 수 없어요');
      const m = bbSend(r, 'artist', { text: o.text || '…' });
      const see = viewing('bubble', 'room', r.id);
      if (!see) r.unread = num(r.unread) + 1; else U.scrollBottom = true;
      if (see) { sNotify('msg'); commit(); return; }
      deliver({ app: 'bubble', title: r.artist, body: bbPreview(r, m), open: ['bubble', 'room', { id: r.id }], av: av(r.avatar, r.artist) }, 'msg');
    } else if (o.app === 'tw') {
      const d = byId(S.tw.dms, o.target); if (!d) return toast('DM을 찾을 수 없어요');
      twSendDM(d, 'them', o.text || '…');
      const see = viewing('tw', 'dmroom', d.id);
      if (!see) d.unread = true; else U.scrollBottom = true;
      const u = twU(d.user);
      if (see) { sNotify('msg'); commit(); return; }
      deliver({ app: 'tw', title: u.name, body: o.text, open: ['tw', 'dmroom', { id: d.id }], av: av(u.avatar, u.name) }, 'msg');
    } else if (o.app === 'twn') {
      const u = twU(o.target), n = sysNow(), k = TWKIND[o.kind] ? o.kind : 'like';
      const mine = S.tw.tweets.filter(t => t.author === 'me' && !t.replyTo).sort((a, b) => tsOf(b.date, b.time) - tsOf(a.date, a.time))[0];
      const x = { id: uid(), kind: k, user: u.id, text: k === 'mention' || k === 'reply' ? (o.text || '') : (k === 'follow' ? '' : (mine?.text || '')), date: ymd(n), time: hm(n), unread: true };
      S.tw.notifs.unshift(x);
      if (k === 'like' && mine) mine.likes = num(mine.likes) + 1;
      if (k === 'rt' && mine) mine.rts = num(mine.rts) + 1;
      if (k === 'reply' && mine) { mine.replies = num(mine.replies) + 1; S.tw.tweets.push({ id: uid(), author: u.id, text: o.text || '', img: '', date: ymd(n), time: hm(n), replies: 0, rts: 0, likes: 0, views: 1, liked: false, rted: false, bm: false, replyTo: mine.id }); }
      deliver({ app: 'tw', title: u.name, body: twNotifLine(x), open: ['tw', 'notifs', {}], av: av(u.avatar, u.name) }, 'msg');
    } else if (o.app === 'gmail') {
      const n = sysNow(); const m = { id: uid(), folder: 'inbox', from: o.from || '알 수 없음', fromEmail: '', to: '나', subject: o.subject || '(제목 없음)', body: o.text || '', date: ymd(n), time: hm(n), unread: true, starred: false };
      S.gmail.mails.push(m);
      deliver({ app: 'gmail', title: m.from, body: m.subject, open: ['gmail', 'mail', { id: m.id }] }, 'mail');
    } else if (o.app === 'missed') {
      const c = S.phone.contacts.find(x => x.id === o.target);
      const n = sysNow(); S.phone.calls.unshift({ id: uid(), name: c?.name || '', number: c?.number || o.number || '알 수 없음', type: 'missed', count: 1, date: ymd(n), time: hm(n), seen: false, label: c?.label || '휴대전화', dur: '' });
      deliver({ app: 'phone', title: c?.name || o.number, body: '부재중 전화', open: ['phone', 'main', { tab: 'recents' }] }, 'msg');
    } else if (o.app === 'call') {
      const c = S.phone.contacts.find(x => x.id === o.target);
      incomingCall({ name: c?.name || o.name || '', number: c?.number || o.number || '알 수 없음', avatar: c?.avatar });
    } else {
      const n = sysNow(); const x = { id: uid(), app: o.appName || '알림', title: o.from || o.appName || '알림', body: o.text || '', date: ymd(n), time: hm(n), icon: '' };
      S.notifs.push(x);
      deliver({ app: x.app, title: x.title, body: x.body, custom: x, open: null }, 'msg');
    }
  };
  const d = clamp(num(o.delay), 0, 3600);
  if (d) { toast(`${d}초 뒤에 도착해요`); setTimeout(go, d * 1000); } else go();
}

const TWKIND = { like: { label: '마음에 들어요', icon: 'heart', col: '#f91880' }, rt: { label: '재게시', icon: 'repeat', col: '#00ba7c' }, follow: { label: '팔로우', icon: 'user', col: '#1d9bf0' }, reply: { label: '답글', icon: 'comment', col: '#1d9bf0' }, mention: { label: '멘션', icon: 'at', col: '#1d9bf0' } };
function twU(id) { if (id === 'me') return Object.assign({ id: 'me', verified: false }, S.tw.me); return byId(S.tw.users, id) || { id, handle: 'unknown', name: '알 수 없음', avatar: '', following: 0, followers: 0 }; }
function twAgo(t) {
  const diff = (sysNow().getTime() - tsOf(t.date, t.time)) / 60000;
  if (diff < 1) return '방금'; if (diff < 60) return Math.floor(diff) + '분'; if (diff < 1440) return Math.floor(diff / 60) + '시간';
  const d = parseYMD(t.date); return d.getFullYear() === sysNow().getFullYear() ? `${d.getMonth() + 1}월 ${d.getDate()}일` : `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
}
function twStamp(t) { const d = parseYMD(t.date); return `${ampm(t.time)} · ${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`; }
function twText(s) { return nl2br(s).replace(/(^|[\s>(])([#@][\w가-힣_]+)/g, '$1<span class="tw-tag">$2</span>'); }
function twCnt(n) { n = num(n); return n ? compactNum(n) : ''; }
function twBadge(u) { return u.verified ? `<span class="tw-vf">${icf('check', 10)}</span>` : ''; }
function twNotifLine(x) { const k = TWKIND[x.kind] || TWKIND.like; if (x.kind === 'follow') return '님이 회원님을 팔로우했습니다'; if (x.kind === 'reply' || x.kind === 'mention') return x.text; return `님이 회원님의 게시물을 ${x.kind === 'like' ? '마음에 들어 합니다' : '재게시했습니다'}: ${x.text}`; }
function twSorted(list) { return [...list].sort((a, b) => tsOf(b.date, b.time) - tsOf(a.date, a.time)); }
function twActs(t, big) {
  const sz = big ? 22 : 18;
  return `<div class="tw-acts ${big ? 'big' : ''}">
    <button data-act="twReply" data-id="${t.id}">${ic('comment', sz)}${big ? '' : `<span>${twCnt(t.replies)}</span>`}</button>
    <button class="${t.rted ? 'rt' : ''}" data-act="twRT" data-id="${t.id}">${ic('repeat', sz)}${big ? '' : `<span>${twCnt(t.rts)}</span>`}</button>
    <button class="${t.liked ? 'lk' : ''}" data-act="twLike" data-id="${t.id}">${t.liked ? icf('heart', sz) : ic('heart', sz)}${big ? '' : `<span>${twCnt(t.likes)}</span>`}</button>
    ${big ? '' : `<button>${ic('bars', sz)}<span>${twCnt(t.views)}</span></button>`}
    <span class="tw-a2"><button class="${t.bm ? 'bm' : ''}" data-act="twBm" data-id="${t.id}">${t.bm ? icf('bookmark', sz) : ic('bookmark', sz)}</button><button data-act="twShare">${ic('share', sz)}</button></span></div>`;
}
function twRow(t, showRT = true) {
  const u = twU(t.author), parent = t.replyTo ? byId(S.tw.tweets, t.replyTo) : null;
  return `<article class="tw-t" data-act="twOpen" data-id="${t.id}" data-edl="tweet|${t.id}">

}

  el.disabled = true; el.textContent = '생성 중…';
  try {
    const text = await aiReply(r.artist + (r.group ? ` (${r.group})` : ''), r.msgs.filter(m => m.type === 'text').slice(-24).map(m => ({ me: m.from === 'me', text: bbFill(r, m.text) })), `팬 전용 프라이빗 메시지 앱에서 아이돌 아티스트가 팬 '${r.nick}'에게 보내는 다정한 메시지`);
    if (text) { text.split(/\n+/).filter(Boolean).slice(0, 3).forEach(t => bbSend(r, 'artist', { text: t.trim() })); U.scrollBottom = true; commit(); }
  } catch (e) { toast('AI 답장 실패: ' + e.message, 4200); renderApp(); }
};

/* ---------- 편집 스키마 & 패널 ---------- */
function bbRoomFields() { return [{ k: 'avatar', l: '아티스트 프로필', t: 'image', round: true }, { k: 'artist', l: '아티스트 이름', half: true }, { k: 'group', l: '그룹 (선택)', half: true }, { k: 'nick', l: '내 닉네임', half: true }, { k: 'since', l: '구독 시작일 (D+ 계산)', t: 'date', half: true }, { k: 'limit', l: '답장 글자 수 제한', t: 'number', half: true }, { k: 'unread', l: '안 읽은 메시지 수', t: 'number', half: true }, { k: 'bg', l: '대화방 배경 (#색상 또는 이미지)', t: 'image' }, { k: 'pinned', l: '상단 고정', t: 'toggle' }]; }
Object.assign(EDK, {
  bbroom: id => { const r = byId(S.bubble.rooms, id); return { title: '아티스트 · 구독 정보', obj: r, fields: bbRoomFields(), onDelete: () => { del(S.bubble.rooms, r); if (U.app === 'bubble') U.stack = [{ v: 'list', p: {} }]; } }; },
  bbroomNew: () => ({ title: '아티스트 추가', obj: { artist: '', group: '', avatar: '', nick: S.me.name.slice(-2), since: todayStr(), limit: 50, unread: 0, pinned: false, bg: '' }, fields: bbRoomFields(), onSave: v => { if (!v.artist) { toast('아티스트 이름을 입력하세요'); return false; } S.bubble.rooms.push(Object.assign({ id: uid(), msgs: [] }, v)); } }),
  bbnick: id => { const r = byId(S.bubble.rooms, id); return { title: '닉네임 변경', obj: r, note: `${r.artist}의 메시지 속 {닉네임}이 이 이름으로 바뀌어요.`, fields: [{ k: 'nick', l: '닉네임', max: 12 }] }; },
  bbmsg: (rid, mid) => { const r = byId(S.bubble.rooms, rid), m = byId(r.msgs, mid); return { title: '버블 메시지', obj: m, fields: [{ k: 'from', l: '보낸 사람', t: 'select', half: true, opts: [['artist', r.artist], ['me', '나']] }, { k: 'type', l: '종류', t: 'select', half: true, opts: [['text', '텍스트'], ['image', '사진'], ['voice', '음성'], ['video', '동영상']] }, { k: 'text', l: '내용 ({닉네임} 사용 가능)', t: 'textarea', rows: 3 }, { k: 'src', l: '사진 / 음성 / 영상 파일·링크', t: 'media', accept: 'image/*,audio/*,video/*' }, { k: 'dur', l: '음성 길이 표시', half: true, ph: '0:15' }, { k: 'date', l: '날짜', t: 'date', half: true }, { k: 'time', l: '시간', t: 'time' }], onDelete: () => del(r.msgs, m) }; }
});
APP_ACTIONS.bubble = () => { const v = curView(); const a = [['아티스트 추가', () => openEditor('bbroomNew')], ...S.bubble.rooms.map(r => ['아티스트 편집: ' + r.artist, () => openEditor('bbroom', r.id)])]; if (v?.v === 'room') a.unshift(['이 방에 아티스트 메시지 수신 연출', () => { P.tab = 'sim'; P.sim.app = 'bubble'; P.sim.target = v.p.id; renderPanel(); }], ['사진·음성·영상 메시지 추가', () => ACT.bbAttach({ dataset: { id: v.p.id } })]); return a; };

/* =========================================================
   이벤트 연결 · 틱 루프 · 초기화
   ========================================================= */
function fitStage() {
  const wide = window.innerWidth >= 1000;
  const panelW = P.open && !S.sys.readonly && wide ? 380 : 0;
  const aw = window.innerWidth - panelW - 24, ah = window.innerHeight - 24;
  const k = Math.min(1.12, aw / 446, ah / 902);
  const sc = $('#scaler');
  sc.style.transform = `scale(${k})`;
  $('#stage').style.width = Math.floor(446 * k) + 'px';
  $('#stage').style.height = Math.floor(902 * k) + 'px';
  $('#device').dataset.color = S.sys.deviceColor || 'natural';
  placeYT();
}
window.addEventListener('resize', fitStage);

/* --- 클릭 / 편집 가로채기 --- */
let suppressClick = false;
document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const t = e.target;
  // 모달 폼 버튼
  const fa = t.closest('[data-fact]'); if (fa && $('#modalHost').contains(fa)) { e.preventDefault(); formAction(fa); return; }
  const screen = $('#screen');
  if (screen.contains(t) && editorOn()) {
    const ed = t.closest('[data-ed]'), act = t.closest('[data-act]');
    const inputLike = t.closest('input,textarea,select');
    if (ed && !inputLike && !(act && ed.contains(act) && act !== ed)) { e.preventDefault(); e.stopPropagation(); openEditorFromEl(ed); return; }
  }
  const a = t.closest('[data-act]');
  if (!a) return;
  const fn = ACT[a.dataset.act];
  if (fn) { if (a.tagName === 'A') e.preventDefault(); fn(a, e); }
}, true);
document.addEventListener('submit', e => { e.preventDefault(); });
document.addEventListener('dblclick', e => { const d = e.target.closest('[data-dbl]'); if (d && DBL[d.dataset.dbl]) { e.preventDefault(); DBL[d.dataset.dbl](d, e); } });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset?.in && INP[el.dataset.in]) INP[el.dataset.in](el, e);
  if ($('#screen').contains(el) && !lastKeyAt) { if (e.inputType?.startsWith('delete')) sKey('del'); else if (e.inputType?.startsWith('insert')) sKey(); }
  lastKeyAt = 0;
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset?.change && CHG[el.dataset.change]) CHG[el.dataset.change](el, e); });
let lastKeyAt = 0;
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Escape') { if (FORM) { closeForm(); return; } if (U.sheet) { closeSheet(); return; } }
  if (e.key === 'Enter' && FORM && el.closest?.('#modalHost') && el.tagName === 'INPUT' && !(e.isComposing || e.keyCode === 229)) { e.preventDefault(); formSubmit(); return; }
  if ($('#screen').contains(el) && /INPUT|TEXTAREA/.test(el.tagName) && !e.metaKey && !e.ctrlKey) {
    if (!['Shift', 'Alt', 'Meta', 'Control', 'CapsLock', 'Tab', 'Escape', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
      sKey(e.key === 'Backspace' ? 'del' : e.key === ' ' ? 'sp' : 'k'); lastKeyAt = Date.now();
    }
  }
  if (e.key === 'Enter' && !e.shiftKey && el.dataset?.enter && !(e.isComposing || e.keyCode === 229)) {
    e.preventDefault(); KEY[el.dataset.enter]?.(el, e);
  }
});
// 편집: 우클릭 / 길게 누르기
document.addEventListener('contextmenu', e => {
  if (!editorOn() || !$('#screen').contains(e.target)) return;
  const ed = e.target.closest('[data-ed],[data-edl]'); if (!ed) return;
  e.preventDefault(); openEditorFromEl(ed);
});
let lpT = null, lpStart = null;
document.addEventListener('pointerdown', e => {
  if (!$('#screen').contains(e.target)) return;
  if (e.button !== 0) return;
  // 리플 피드백
  const pr = e.target.closest('.hm-app,.cell.nav,.kk-cr,.ig-dmr,.gm-row,.nt-row,.ph-rc,.mu-tr');
  if (pr) { pr.classList.add('pressed'); setTimeout(() => pr.classList.remove('pressed'), 180); }
  if (!editorOn()) return;
  const ed = e.target.closest('[data-ed],[data-edl]'); if (!ed || e.target.closest('input,textarea,select,#mapSvg')) return;
  lpStart = { x: e.clientX, y: e.clientY };
  clearTimeout(lpT);
  lpT = setTimeout(() => { lpT = null; suppressClick = true; setTimeout(() => suppressClick = false, 700); openEditorFromEl(ed); }, 560);
});
document.addEventListener('pointermove', e => { if (lpT && lpStart && Math.hypot(e.clientX - lpStart.x, e.clientY - lpStart.y) > 8) { clearTimeout(lpT); lpT = null; } });
document.addEventListener('pointerup', () => { clearTimeout(lpT); lpT = null; });
document.addEventListener('pointercancel', () => { clearTimeout(lpT); lpT = null; });

/* --- 잠금화면 스와이프 & 홈바 제스처 --- */
(function lockGesture() {
  let st = null;
  const lock = $('#lock');
  lock.addEventListener('pointerdown', e => {
    if (!U.locked || U.pinOpen || e.target.closest('.lk-card,.lk-qb,.lk-media,button,.lk-moreall')) return;
    st = { y: e.clientY, t: Date.now() };
  });
  window.addEventListener('pointermove', e => {
    if (!st) return; const dy = Math.min(0, e.clientY - st.y);
    const m = $('.lk-main', lock); if (m) { m.style.transform = `translateY(${dy * 0.6}px)`; m.style.opacity = 1 + dy / 600; }
  });
  window.addEventListener('pointerup', e => {
    if (!st) return; const dy = e.clientY - st.y; st = null;
    const m = $('.lk-main', lock); if (m) { m.style.transform = ''; m.style.opacity = ''; }
    if (dy < -70) startUnlock();
  });
  const hb = $('#homebar'); let hs = null;
  hb.addEventListener('pointerdown', e => { hs = e.clientY; });
  hb.addEventListener('pointerup', e => { if (hs != null && e.clientY - hs < -12) { ACT.homebar(); suppressClick = true; setTimeout(() => suppressClick = false, 300); } hs = null; });
})();

/* --- 최상단 쓸어내리기 → 알림 센터 --- */
(function ncGesture() {
  const scr = $('#screen'); let st = null;
  scr.addEventListener('pointerdown', e => {
    if (U.locked || U.call || U.alarmRinging || FORM) return;
    const r = scr.getBoundingClientRect(), k = r.height / 852, y = (e.clientY - r.top) / k;
    if (y < 50) st = { y: e.clientY, k };
  });
  window.addEventListener('pointermove', e => {
    if (!st) return;
    if ((e.clientY - st.y) / st.k > 60) { st = null; openNC(); suppressClick = true; setTimeout(() => suppressClick = false, 400); }
  });
  window.addEventListener('pointerup', () => { st = null; });
  window.addEventListener('pointercancel', () => { st = null; });
})();

/* --- 하드웨어 버튼 --- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-hw]'); if (!b) return;
  const k = b.dataset.hw;
  if (k === 'power') { if (U.locked) { const l = $('#lock'); l.classList.remove('wake'); void l.offsetWidth; l.classList.add('wake'); } else lockPhone(); }
  else if (k === 'volup' || k === 'voldn') {
    S.sys.volume = clamp(num(S.sys.volume) + (k === 'volup' ? 10 : -10), 0, 100); save();
    if (Player.audio) Player.audio.volume = SND.v; Player.ytCmd('setVolume', [S.sys.volume]);
    const h = $('#volHud'); h.innerHTML = `${ic('speaker', 16)}<i><b style="height:${S.sys.volume}%"></b></i>`; h.classList.add('on'); clearTimeout(h._t); h._t = setTimeout(() => h.classList.remove('on'), 1300);
    sKey();
  } else if (k === 'action') { S.sys.focus = !S.sys.focus; haptic(20); toast(S.sys.focus ? '방해금지 모드 켬' : '방해금지 모드 끔'); commit(); }
});

/* --- 틱 루프 --- */
let lastMin = '';
setInterval(() => {
  const n = sysNow(), key = ymd(n) + hm(n);
  if (key !== lastMin) {
    const first = !lastMin; lastMin = key;
    if (!first) {
      renderStatus();
      if (U.locked && !U.pinOpen) renderLock();
      if (!U.app) renderHome();
      if (S.sys.live) S.alarms.forEach(a => { if (a.on && a.time === hm(n) && U.lastAlarm !== key + a.id && !U.alarmRinging) { U.lastAlarm = key + a.id; ringAlarm(a); } });
    }
  }
  if (U.call?.connected) { const t = $('#callTime'); if (t) t.textContent = fmtSec((Date.now() - U.call.start) / 1000); }
}, 1000);
setInterval(() => {
  if (U.timer?.running) {
    const left = timerLeft();
    const tt = $('.di-tt'); if (tt) tt.textContent = fmtDur(left);
    const tm = $('#tmT'); if (tm) tm.textContent = fmtDur(left);
    const ring = $('#tmRing'); if (ring) ring.setAttribute('stroke-dashoffset', (1 - left / U.timer.total) * 2 * Math.PI * 92);
    if (left <= 0) { U.timer = null; sNotify('done'); islandFlash({ app: 'clock', title: '타이머', body: '타이머가 종료되었습니다', open: ['clock', 'main', { tab: 'timer' }] }, 4500); if (U.app === 'clock') renderApp(); }
  }
  if (U.sw.running) { const d = $('#swD'); if (d) d.textContent = fmtSW(U.sw.acc + Date.now() - U.sw.start); }
}, 60);

/* --- 초기화 --- */
function boot() {
  AIKEY.init();
  if (S.sys.readonly) document.body.classList.add('readonly');
  $('#island').dataset.act = 'island';
  setSysDateTime();
  fitStage();
  renderHome(); renderLock(); renderStatus(); renderIsland(); renderPanel();
  // 첫 사용자 상호작용 시 오디오 컨텍스트 깨우기
  const wake = () => { SND.c; document.removeEventListener('pointerdown', wake); };
  document.addEventListener('pointerdown', wake);
  document.body.classList.add('ready');
}
boot();

</script>
</body>
